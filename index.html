// ── API HELPER ──────────────────────────────────────────────
function apiCall(path, method, body) {
  var options = { method: method || 'GET' };
  if (body) {
    options.headers = { 'Content-Type': 'application/json' };
    options.body = JSON.stringify(body);
  }
 
  console.log('[API] →', method || 'GET', path, body || '');
 
  return fetch(path, options)
    .then(function(r) {
      console.log('[API] ← status:', r.status, path);
      if (r.ok) {
        return r.json().then(function(data) {
          console.log('[API] ← body:', data);
          return data;
        });
      } else {
        return r.text().then(function(txt) {
          console.warn('[API] ← error response:', txt);
          return null;
        });
      }
    })
    .catch(function(e) {
      console.error('[API] ← fetch failed:', e.message, path);
      return null;
    });
}
    
// ── SESSION TRACKING ──────────────────────────────────────────
var SESSION_ID = (function() {
  var key = 'calcio_session';
  var id = localStorage.getItem(key);
  if (!id) {
    id = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem(key, id);
  }
  return id;
})();

function trackSession() {
  apiCall(
    '/.netlify/functions/track-session',
    'POST',
    {
      session_id: SESSION_ID,
      user_agent: navigator.userAgent.slice(0, 200)
    }
  );
}

// ── SAVE MATCH SIMULATION ─────────────────────────────────────
// Call this after doKickOff() completes
function saveMatchResult(match) {
  if (!match || !match.hTeam || !match.aTeam) return;
 
  var hS20 = STATS20.find(function(x){ return x.abbr === match.hTeam.abbr; }) || {};
  var aS20 = STATS20.find(function(x){ return x.abbr === match.aTeam.abbr; }) || {};
  var hADV = ADV[match.hTeam.abbr] || {};
  var aADV = ADV[match.aTeam.abbr] || {};
 
  apiCall(
    '/.netlify/functions/save-match',
    'POST',
    {
      session_id:   SESSION_ID,
      home_abbr:    match.hTeam.abbr,  away_abbr:    match.aTeam.abbr,
      home_name:    match.hTeam.name,  away_name:    match.aTeam.name,
      home_goals:   match.hG,          away_goals:   match.aG,
      home_win_pct: match.hW,          draw_pct:     match.dP,
      away_win_pct: match.aW,
      home_ppda:    hS20.ppda  || null, away_ppda:   aS20.ppda  || null,
      home_block:   hS20.block || null, away_block:  aS20.block || null,
      tactic_label: match.tacticLabel  || null,
      home_xg:      hADV.xG  || hS20.xg  || null,
      away_xg:      aADV.xG  || aS20.xg  || null,
      home_xga:     hADV.xGA || hS20.xga || null,
      away_xga:     aADV.xGA || aS20.xga || null
    }
  );
}

// ── SAVE STANDINGS SNAPSHOT ───────────────────────────────────
// Call this when you update the app to a new matchday
function saveStandingsSnapshot(matchday, titleProbs, clProbs) {
  var teamsData = TEAMS.map(function(t) {
    var s20 = STATS20.find(function(x){ return x.abbr === t.abbr; }) || {};
    return {
      team_abbr:          t.abbr,
      team_name:          t.name,
      points:             t.pts,
      wins:               t.w,
      draws:              t.d,
      losses:             t.l,
      rank:               t.rank,
      xg_per_game:        s20.xg    || null,
      xga_per_game:       s20.xga   || null,
      ppda:               s20.ppda  || null,
      shots_per_game:     s20.shots || null,
      possession_pct:     s20.poss  || null,
      tackles_per_game:   s20.tkl   || null,
      turnovers_per_game: s20.trn   || null,
      block_style:        s20.block || null,
      title_pct:          titleProbs ? (titleProbs[t.abbr] || 0) : null,
      cl_spot_pct:        clProbs    ? (clProbs[t.abbr]    || 0) : null
    };
  });
 
  apiCall(
    '/.netlify/functions/save-standings',
    'POST',
    { matchday: matchday, teams: teamsData }
  );
}

// ── LOAD MATCH HISTORY FROM DB ────────────────────────────────
// Replaces in-memory state.hist with DB results
function loadMatchHistory() {
  apiCall(
    '/.netlify/functions/match-history?session_id=' + encodeURIComponent(SESSION_ID),
    'GET'
  )
  .then(function(res) {
    if (!res || !res.rows) return;
    state.hist = res.rows.map(function(r) {
      return { home: r.home_name, away: r.away_name, hG: r.home_goals, aG: r.away_goals };
    });
    render();
  });
}

// ═══════════════════════════════════════════════════
// DIXON-COLES ENGINE (CALIBRATED v2)
// ═══════════════════════════════════════════════════
 
function poissonPMF(k, lambda) {
  if (k < 0 || lambda <= 0) return 0;
  var logP = -lambda + k * Math.log(lambda);
  for (var i = 2; i <= k; i++) logP -= Math.log(i);
  return Math.exp(logP);
}
 
function dcTau(h, a, lH, lA, rho) {
  if (h === 0 && a === 0) return 1 - lH * lA * rho;
  if (h === 1 && a === 0) return 1 + lA * rho;
  if (h === 0 && a === 1) return 1 + lH * rho;
  if (h === 1 && a === 1) return 1 - rho;
  return 1;
}
 
function dcMatrix(lH, lA, rho) {
  var mx = [], total = 0;
  for (var h = 0; h <= 8; h++) {
    mx[h] = [];
    for (var a = 0; a <= 8; a++) {
      mx[h][a] = poissonPMF(h, lH) * poissonPMF(a, lA) * dcTau(h, a, lH, lA, rho);
      total += mx[h][a];
    }
  }
  for (var h2 = 0; h2 <= 8; h2++)
    for (var a2 = 0; a2 <= 8; a2++)
      mx[h2][a2] /= total;
  return mx;
}
 
function dcOutcomes(mx) {
  var hW = 0, dr = 0, aW = 0;
  for (var h = 0; h <= 8; h++)
    for (var a = 0; a <= 8; a++) {
      if (h > a) hW += mx[h][a];
      else if (h === a) dr += mx[h][a];
      else aW += mx[h][a];
    }
  return { homeWin: hW, draw: dr, awayWin: aW };
}
 
function dcTopScores(mx, n) {
  var scores = [];
  for (var h = 0; h <= 7; h++)
    for (var a = 0; a <= 7; a++)
      scores.push({ h: h, a: a, p: mx[h][a] });
  scores.sort(function(x, y) { return y.p - x.p; });
  return scores.slice(0, n || 10);
}
 
function dcSample(mx) {
  var r = Math.random(), cum = 0;
  for (var h = 0; h <= 8; h++)
    for (var a = 0; a <= 8; a++) {
      cum += mx[h][a];
      if (r < cum) return { h: h, a: a };
    }
  return { h: 0, a: 0 };
}
 
// ── MISMATCH AMPLIFIERS ──
 
function mismatchFactor(myStr, oppStr) {
  var gap = myStr - oppStr;
  if (gap <= 0) return 1.0;
  return 1.0 + Math.pow(gap / 100, 1.35) * 1.8;
}
 
function defCollapseMultiplier(oppStr) {
  if (oppStr >= 40) return 1.0;
  return 1.0 + Math.pow((40 - oppStr) / 40, 1.2) * 0.5;
}
 
// ── CALIBRATED LAMBDA COMPUTATION ──
 
function dcLambdas(ha, aa) {
  var hA = ADV[ha] || {};
  var aA = ADV[aa] || {};
  var hS2 = hA.str || OPP[ha] || 50;
  var aS2 = aA.str || OPP[aa] || 50;
  var hTD = TDATA[ha] || { bk:"medium" };
  var aTD = TDATA[aa] || { bk:"medium" };
  var muH = BLOCK_MU[hTD.bk + "_vs_" + aTD.bk] || { gm:1.0, label:"" };
  var muA = BLOCK_MU[aTD.bk + "_vs_" + hTD.bk] || { gm:1.0, label:"" };
 
  var hXG  = hA.xG  || (GXG[ha] ? GXG[ha].xg  : 1.21);
  var hXGA = hA.xGA || (GXG[ha] ? GXG[ha].xga : 1.21);
  var aXG  = aA.xG  || (GXG[aa] ? GXG[aa].xg  : 1.21);
  var aXGA = aA.xGA || (GXG[aa] ? GXG[aa].xga : 1.21);
 
  var hAtt = hXG / 1.21;
  var hDef = 1.21 / Math.max(aXGA, 0.5);
  var aAtt = aXG / 1.21;
  var aDef = 1.21 / Math.max(hXGA, 0.5);
 
  var strGap = Math.abs(hS2 - aS2);
  var strExp = 0.18 + Math.min(strGap, 60) * 0.002;
  var strRatio = Math.pow(Math.max(hS2, 1) / Math.max(aS2, 1), strExp);
 
  var hMismatch = mismatchFactor(hS2, aS2);
  var aMismatch = mismatchFactor(aS2, hS2);
  var aDefCollapse = defCollapseMultiplier(aS2);
  var hDefCollapse = defCollapseMultiplier(hS2);
 
  var hL = 1.30 * Math.sqrt(hAtt * hDef) * strRatio * muH.gm * hMismatch * aDefCollapse;
  var aL = 1.15 * Math.sqrt(aAtt * aDef) * (1 / strRatio) * muA.gm * aMismatch * hDefCollapse;
 
  hL = Math.min(3.2, Math.max(0.3, hL));
  aL = Math.min(3.2, Math.max(0.3, aL));
 
  if (strGap > 35) {
    var suppression = 1.0 - Math.min((strGap - 35) / 80, 0.35);
    if (hS2 > aS2) aL = Math.max(0.3, aL * suppression);
    else hL = Math.max(0.3, hL * suppression);
  }
 
  var avgGm = (muH.gm + muA.gm) / 2;
  var rho;
  if (strGap > 40) rho = -0.02;
  else if (avgGm > 1.1) rho = -0.04;
  else if (avgGm < 0.85) rho = -0.12;
  else rho = -0.08;
 
  return { hL:hL, aL:aL, rho:rho, muH:muH, muA:muA, hTD:hTD, aTD:aTD };
}
 
function dcAnalyse(ha, aa) {
  var params = dcLambdas(ha, aa);
  var matrix = dcMatrix(params.hL, params.aL, params.rho);
  var outcomes = dcOutcomes(matrix);
  var topScores = dcTopScores(matrix, 12);
  return {
    matrix:matrix, outcomes:outcomes, topScores:topScores,
    hL:params.hL, aL:params.aL, rho:params.rho,
    muH:params.muH, muA:params.muA, hTD:params.hTD, aTD:params.aTD
  };
}

// LEGACY FUNCTIONS
// ═══════════════════════════════════════════════════
 
function fscore(form) {
  var weights=[1,1,1,2,3],pts=0,total=0;
  for(var i=0;i<form.length;i++){var w=weights[i]||1;pts+=(form[i]==='W'?3:form[i]==='D'?1:0)*w;total+=3*w;}
  return pts/total;
}
 
function probs(abbr, fx) {
  var t=TEAMS.find(function(x){return x.abbr===abbr;});
  var ha=fx.h?abbr:fx.oppAbbr, aa=fx.h?fx.oppAbbr:abbr;
  var dc=dcAnalyse(ha,aa);
  var o=dc.outcomes;
  var winP,drawP,lossP;
  if(fx.h){winP=o.homeWin*100;drawP=o.draw*100;lossP=o.awayWin*100;}
  else{winP=o.awayWin*100;drawP=o.draw*100;lossP=o.homeWin*100;}
  var formBonus=fscore(t.form);
  var formAdj=(formBonus-0.5)*6;
  winP=Math.min(92,Math.max(3,winP+formAdj));
  lossP=Math.max(2,lossP-formAdj*0.4);
  drawP=Math.max(4,100-winP-lossP);
  var tot=winP+drawP+lossP;
  return{winP:winP/tot*100,drawP:drawP/tot*100,lossP:lossP/tot*100};
}
 
function roll(wp,dp){var r=Math.random()*100;if(r<wp)return"W";if(r<wp+dp)return"D";return"L";}
 
function h2h(ha, aa) {
  var hT=TEAMS.find(function(t){return t.abbr===ha;});
  var aT=TEAMS.find(function(t){return t.abbr===aa;});
  var dc=dcAnalyse(ha,aa);
  var score=dcSample(dc.matrix);
  var hG=score.h,aG=score.a;
  var mins=[];for(var i=1;i<=90;i++)mins.push(i);
  mins.sort(function(){return Math.random()-0.5;});
  var goalMins=mins.slice(0,hG+aG).sort(function(a,b){return a-b;});
  var sides=[];for(var j=0;j<hG;j++)sides.push("H");for(var k=0;k<aG;k++)sides.push("A");
  sides.sort(function(){return Math.random()-0.5;});
  var hs=0,as2=0;
  var evs=goalMins.map(function(min,idx){
    var isH=sides[idx]==="H";if(isH)hs++;else as2++;
    var ab=isH?ha:aa;var ro=PL[ab]?PL[ab].slice(1):["Unknown"];
    return{min:min,type:"goal",team:ab,scorer:ro[Math.floor(Math.random()*ro.length)],hS:hs,aS:as2};
  });
  var cMins=mins.slice(hG+aG,hG+aG+Math.floor(Math.random()*4)+1).sort(function(a,b){return a-b;});
  cMins.forEach(function(min){evs.push({min:min,type:"yellow",team:Math.random()>0.5?ha:aa});});
  evs.sort(function(a,b){return a.min-b.min;});
  var hS20=STATS20.find(function(x){return x.abbr===ha;})||{};
  var aS20=STATS20.find(function(x){return x.abbr===aa;})||{};
  var pressNote=(hS20.ppda&&aS20.ppda)?(hS20.ppda<9?'High press':hS20.ppda<12?'Med press':'Low block')+' ('+hS20.ppda+') vs '+(aS20.ppda<9?'High press':aS20.ppda<12?'Med press':'Low block')+' ('+aS20.ppda+')':'';
  var o=dc.outcomes;
  return{hG:hG,aG:aG,evs:evs,hW:Math.round(o.homeWin*100),dP:Math.round(o.draw*100),aW:Math.round(o.awayWin*100),
    topScores:dc.topScores,tacticLabel:(dc.muH.label||pressNote),pressNote:pressNote,
    hBk:dc.hTD.bk,aBk:dc.aTD.bk,hBlock:dc.hTD.block||'',aBlock:dc.aTD.block||'',
    hS20:hS20,aS20:aS20,hTeam:hT,aTeam:aT,rho:dc.rho,hL:dc.hL,aL:dc.aL,matrix:dc.matrix};
}

function mcRun(n) {
  var titles={INT:0,NAP:0,ACM:0,COM:0,JUV:0,ROM:0};
  var clSpots={INT:0,NAP:0,ACM:0,COM:0,JUV:0,ROM:0};
  var dist={INT:[],NAP:[],ACM:[],COM:[],JUV:[],ROM:[]};
  var ties=0;
  var dcCache={};
  TOP6.forEach(function(t){if(!FX[t.abbr])return;FX[t.abbr].forEach(function(fx){
    var ha2=fx.h?t.abbr:fx.oppAbbr,aa2=fx.h?fx.oppAbbr:t.abbr;
    var key=ha2+'_'+aa2;if(!dcCache[key])dcCache[key]=dcAnalyse(ha2,aa2).outcomes;
  });});
  for(var i=0;i<n;i++){
    var pts={INT:69,NAP:62,ACM:63,COM:57,JUV:54,ROM:54};
    var h2hResults={};
    TOP4_H2H.forEach(function(clash){
      var key=clash.home+'_'+clash.away;var o=dcCache[key]||dcAnalyse(clash.home,clash.away).outcomes;
      var r=Math.random();h2hResults[key]=r<o.homeWin?'W':r<o.homeWin+o.draw?'D':'L';
    });
    TOP6.forEach(function(t){if(!FX[t.abbr])return;FX[t.abbr].forEach(function(fx){
      var h2hKey='';TOP4_H2H.forEach(function(clash){
        if(clash.home===t.abbr&&clash.away===fx.oppAbbr)h2hKey=clash.home+'_'+clash.away;
        if(clash.away===t.abbr&&clash.home===fx.oppAbbr)h2hKey=clash.home+'_'+clash.away;
      });
      if(h2hKey){var homeRes=h2hResults[h2hKey];
        var myRes=t.abbr===h2hKey.split('_')[0]?homeRes:(homeRes==='W'?'L':homeRes==='L'?'W':'D');
        pts[t.abbr]+=myRes==='W'?3:myRes==='D'?1:0;
      }else{
        var ha2=fx.h?t.abbr:fx.oppAbbr,aa2=fx.h?fx.oppAbbr:t.abbr;
        var key2=ha2+'_'+aa2;var o=dcCache[key2];
        if(o){var r2=Math.random();var res=r2<o.homeWin?(fx.h?'W':'L'):r2<o.homeWin+o.draw?'D':(fx.h?'L':'W');
          pts[t.abbr]+=res==='W'?3:res==='D'?1:0;
        }else{var p=probs(t.abbr,fx);var res2=roll(p.winP,p.drawP);pts[t.abbr]+=res2==='W'?3:res2==='D'?1:0;}
      }
    });});
    TOP6.forEach(function(t){dist[t.abbr].push(pts[t.abbr]);});
    var mx=-1;TOP6.forEach(function(t){if(pts[t.abbr]>mx)mx=pts[t.abbr];});
    var winners=TOP6.filter(function(t){return pts[t.abbr]===mx;});
    if(winners.length>1)ties++;
    var w=winners.find(function(x){return x.abbr==='INT';})||winners[0];titles[w.abbr]++;
    var ranked=TOP6.slice().sort(function(a,b){if(pts[b.abbr]!==pts[a.abbr])return pts[b.abbr]-pts[a.abbr];return a.rank-b.rank;});
    for(var j=0;j<4;j++)clSpots[ranked[j].abbr]++;
  }
  var avg={},mn={},mx2={};
  TOP6.forEach(function(t){var d=dist[t.abbr];avg[t.abbr]=(d.reduce(function(a,b){return a+b;},0)/d.length).toFixed(1);mn[t.abbr]=Math.min.apply(null,d);mx2[t.abbr]=Math.max.apply(null,d);});
  return{titles:titles,clSpots:clSpots,n:n,ties:ties,avg:avg,mn:mn,mx:mx2};
}

function doRunIn(){
  var h2hResults={};
  TOP4_H2H.forEach(function(clash){var dc=dcAnalyse(clash.home,clash.away);var o=dc.outcomes;var r=Math.random();h2hResults[clash.home+'_'+clash.away]=r<o.homeWin?'W':r<o.homeWin+o.draw?'D':'L';});
  var sim={};
  TOP6.forEach(function(t){var cum=0;sim[t.abbr]=FX[t.abbr].map(function(fx){
    var h2hKey='';TOP4_H2H.forEach(function(clash){if(clash.home===t.abbr&&clash.away===fx.oppAbbr)h2hKey=clash.home+'_'+clash.away;if(clash.away===t.abbr&&clash.home===fx.oppAbbr)h2hKey=clash.home+'_'+clash.away;});
    var res;
    if(h2hKey){var hr=h2hResults[h2hKey];res=t.abbr===h2hKey.split('_')[0]?hr:(hr==='W'?'L':hr==='L'?'W':'D');}
    else{var ha2=fx.h?t.abbr:fx.oppAbbr,aa2=fx.h?fx.oppAbbr:t.abbr;var dc=dcAnalyse(ha2,aa2);var o=dc.outcomes;var r2=Math.random();var rawRes=r2<o.homeWin?'W':r2<o.homeWin+o.draw?'D':'L';res=fx.h?rawRes:(rawRes==='W'?'L':rawRes==='L'?'W':'D');}
    cum+=res==='W'?3:res==='D'?1:0;var pp=probs(t.abbr,fx);return{res:res,cum:cum,winP:Math.round(pp.winP),drawP:Math.round(pp.drawP)};
  });});
  setState({sim:sim,ran:true});
}

      var winCell=r?'<span style="color:#69f0ae;font-size:0.63rem">'+r.winP+'%</span><span style="color:#333;font-size:0.58rem"> / '+r.drawP+'%</span>':'<span style="color:#222">-</span>';
      return'<div style="display:grid;grid-template-columns:28px 56px 16px 1fr 56px 72px 72px 72px;padding:7px 12px;border-bottom:1px solid #0d1117;align-items:center;background:'+(fx.big?'rgba(201,168,76,0.03)':'transparent')+'">'
        +'<div style="font-size:0.63rem;color:#555">'+fx.md+'</div><div style="font-size:0.63rem;color:#555">'+fx.date+'</div>'
        +'<div style="font-size:0.65rem">'+(fx.big?'\u{1F525}':'')+'</div><div style="font-size:0.8rem;font-weight:500">'+fx.opp+'</div>'
        +'<div><span style="font-size:0.56rem;padding:2px 5px;background:'+(fx.h?'rgba(0,230,118,0.1)':'rgba(255,109,0,0.1)')+';color:'+(fx.h?'#00e676':'#ff6d00')+'">'+(fx.h?'HOME':'AWAY')+'</span></div>'
        +'<div style="text-align:center">'+diff+'</div><div style="text-align:center">'+winCell+'</div><div style="text-align:center">'+resCell+'</div></div>';
    }).join('');
    return'<div style="background:#0c1018;border:1px solid #181e28;margin-bottom:12px;overflow:hidden">'

      +'<div style="display:grid;grid-template-columns:28px 56px 16px 1fr 56px 72px 72px 72px;font-size:0.56rem;color:#333;padding:4px 12px;border-bottom:1px solid #0f1419;letter-spacing:0.07em;text-transform:uppercase">'
      +'<div>MD</div><div>Date</div><div></div><div>Opponent</div><div>Venue</div><div style="text-align:center">Diff</div><div style="text-align:center">Win%</div><div style="text-align:center">Result</div></div>'+rows+'</div>';
  }).join('');
  return'<div><div style="font-family:Georgia,serif;font-size:1.25rem;font-weight:700;margin-bottom:3px">Title Race &amp; Champions League Run-In</div>'
    +'<div style="font-size:0.7rem;color:#555;margin-bottom:16px">MD31 - 8 games remaining \u2022 LLM </div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">'+cards+'</div>'
    +'<div style="text-align:center;margin-bottom:16px"><button class="B" data-action="runin">'+(ran?'Resimulate':'Simulate Run-In')+'</button></div>'+tables+'</div>';
}

function renderStats(){
  var a=ADV;
  var metrics=[{key:'xG',label:'xG / game',lo:false},{key:'xGA',label:'xGA / game',lo:true},{key:'shots',label:'Shots / game',lo:false},{key:'str',label:'Str Rating',lo:false}];

  function blockBadge(b){var col=b==='High Press'?'#ff1744':b==='Med Press'?'#ffd740':b==='Low Block'?'#4fc3f7':b==='Hybrid'?'#ce93d8':'#aaa';return'<span style="display:inline-block;padding:1px 5px;font-size:0.5rem;font-weight:700;background:'+col+'22;color:'+col+';border:1px solid '+col+'44;border-radius:2px">'+b+'</span>';}

function simGoalAdj(side) {
  var s = state.sim;
  var rot = side === 'h' ? s.homeRotation : s.awayRotation;
  var form = SIM_FORMATIONS[side === 'h' ? s.homeFormation : s.awayFormation] || SIM_FORMATIONS['default'];
  var oForm = SIM_FORMATIONS[side === 'h' ? s.awayFormation : s.homeFormation] || SIM_FORMATIONS['default'];
  var morale = side === 'h' ? s.homeMorale : s.awayMorale;
  var w = SIM_WEATHER[s.weather] || SIM_WEATHER['clear'];
  var adj = 0;
  adj -= (rot / 100) * 1.2;
  adj += form.atk * 3;
  adj -= oForm.def * 2.5;
  adj += ((morale - 50) / 50) * 0.5;
  if (side === 'h' && s.homeAdvantage) adj += 0.3;
  if (s.rivalry) adj += 0.25;
  if (Math.random() < w.chaos) adj += (Math.random() < 0.5 ? 1 : -1);
  return adj;
}
 
function pickPlayer(abbr) {
  var roster = PL[abbr];
  if (!roster || roster.length === 0) return 'Unknown';
  // slice(1) skips goalkeeper for goal scorers
  var outfield = roster.slice(1);
  if (outfield.length === 0) return roster[0];
  return outfield[Math.floor(Math.random() * outfield.length)];
}

function buildAdjustedMatch(ha, aa, hGAdj, aGAdj) {
  var hT = TEAMS.find(function(t) { return t.abbr === ha; });
  var aT = TEAMS.find(function(t) { return t.abbr === aa; });
  var dc = dcAnalyse(ha, aa);
  var score = dcSample(dc.matrix);
  var hG = Math.max(0, Math.round(score.h + hGAdj));
  var aG = Math.max(0, Math.round(score.a + aGAdj));
 
  var mins = []; for (var i = 1; i <= 90; i++) mins.push(i);
  mins.sort(function() { return Math.random() - 0.5; });
 
  var totalGoals = hG + aG;
  var goalMins = mins.slice(0, totalGoals).sort(function(a, b) { return a - b; });
 
  var sides = [];
  for (var j = 0; j < hG; j++) sides.push('H');
  for (var k = 0; k < aG; k++) sides.push('A');
  sides.sort(function() { return Math.random() - 0.5; });
 
  // Goal events with real player names
  var hs = 0, as2 = 0;
  var evs = goalMins.map(function(min, idx) {
    var isH = sides[idx] === 'H';
    if (isH) hs++; else as2++;
    var ab = isH ? ha : aa;
    var ro = PL[ab] ? PL[ab].slice(1) : ['Unknown'];
    return {
      min: min, type: 'goal', team: ab,
      scorer: ro[Math.floor(Math.random() * ro.length)],
      hS: hs, aS: as2
    };
  });
 
  // Card events with real player names
  var cardMult = 1 + ((state.sim.refStrictness - 50) / 50) * 0.8;
  var numCards = Math.max(0, Math.floor((Math.floor(Math.random() * 4) + 1) * cardMult));
  if (state.sim.rivalry) numCards += Math.floor(Math.random() * 3);
  var cMins = mins.slice(totalGoals, totalGoals + numCards).sort(function(a, b) { return a - b; });
  cMins.forEach(function(min) {
    var cardTeam = Math.random() > 0.5 ? ha : aa;
    var roster = PL[cardTeam] || ['Unknown'];
    evs.push({
      min: min, type: 'yellow', team: cardTeam,
      player: roster[Math.floor(Math.random() * roster.length)]
    });
  });
 
  evs.sort(function(a, b) { return a.min - b.min; });
 
  // Metadata — same as original h2h
  var hS20 = STATS20.find(function(x) { return x.abbr === ha; }) || {};
  var aS20 = STATS20.find(function(x) { return x.abbr === aa; }) || {};
  var pressNote = (hS20.ppda && aS20.ppda) ?
    (hS20.ppda < 9 ? 'High press' : hS20.ppda < 12 ? 'Med press' : 'Low block') + ' (' + hS20.ppda + ') vs ' +
    (aS20.ppda < 9 ? 'High press' : aS20.ppda < 12 ? 'Med press' : 'Low block') + ' (' + aS20.ppda + ')' : '';
 
  var o = dc.outcomes;
 
  // Tactic label from formations
  var hForm = SIM_FORMATIONS[state.sim.homeFormation] || SIM_FORMATIONS['default'];
  var aForm = SIM_FORMATIONS[state.sim.awayFormation] || SIM_FORMATIONS['default'];
  var tacticLabel = pressNote;
  if (hForm.label !== 'Default' || aForm.label !== 'Default') {
    tacticLabel = (hForm.label !== 'Default' ? hForm.label : 'Default') + ' vs ' +
      (aForm.label !== 'Default' ? aForm.label : 'Default');
  }
 
  return {
    hG: hG, aG: aG, evs: evs,
    hW: Math.round(o.homeWin * 100), dP: Math.round(o.draw * 100), aW: Math.round(o.awayWin * 100),
    topScores: dc.topScores || [],
    tacticLabel: tacticLabel || '',
    pressNote: pressNote || '',
    hBk: dc.hTD ? dc.hTD.bk : '', aBk: dc.aTD ? dc.aTD.bk : '',
    hBlock: (dc.hTD && dc.hTD.block) || '', aBlock: (dc.aTD && dc.aTD.block) || '',
    hS20: hS20, aS20: aS20, hTeam: hT, aTeam: aT,
    rho: dc.rho, hL: dc.hL, aL: dc.aL, matrix: dc.matrix
  };
}
function checkPred(actualH, actualA) {
  var p = state.pred;
  if (!p.locked) return;
  var pH = parseInt(p.h, 10), pA = parseInt(p.a, 10);
  if (isNaN(pH) || isNaN(pA)) return;
  p.attempts++;
  var exact = (pH === actualH && pA === actualA);
  var gdMatch = ((pH - pA) === (actualH - actualA));
  var resultMatch = ((pH > pA && actualH > actualA) || (pH < pA && actualH < actualA) || (pH === pA && actualH === actualA));
  var reward = 0;
  if (exact) { reward = 50; p.streak++; p.correct++; p.lastMsg = '\uD83C\uDFAF EXACT SCORE! +50 coins!'; }
  else if (gdMatch) { reward = 25; p.streak++; p.correct++; p.lastMsg = '\uD83D\uDCD0 Correct goal difference! +25 coins!'; }
  else if (resultMatch) { reward = 10; p.correct++; p.lastMsg = '\u2705 Correct result! +10 coins!'; }
  else { p.streak = 0; p.lastMsg = '\u274C Wrong prediction'; }
  if (p.streak >= 3) { var sb = p.streak * 5; reward += sb; p.lastMsg += ' \uD83D\uDD25 Streak x' + p.streak + ' (+' + sb + ')'; }
  p.coins += reward; p.lastReward = reward; p.lastPH = pH; p.lastPA = pA;
}
 
function doKickOff() {
  if (state.home === state.away || state.playing) return;
  if (playInterval) { clearInterval(playInterval); playInterval = null; }
 
  var m;
  try {
    var hAdj = simGoalAdj('h');
    var aAdj = simGoalAdj('a');
    m = buildAdjustedMatch(state.home, state.away, hAdj, aAdj);
  } catch (err) {
    console.warn('Enhanced sim failed, using original h2h:', err);
    m = h2h(state.home, state.away);
  }
 
  state.match = m; state.evs = []; state.score = { h: 0, a: 0 };
  state.playing = true; state.fin = false; render();
 
  var i = 0;
  playInterval = setInterval(function() {
    if (i >= m.evs.length) {
      clearInterval(playInterval); playInterval = null;
      setTimeout(function() {
        state.fin = true; state.playing = false;
        state.hist = [{ home: m.hTeam.name, away: m.aTeam.name, hG: m.hG, aG: m.aG }].concat(state.hist.slice(0, 4));
        try { checkPred(m.hG, m.aG); } catch (e) { console.warn('Prediction check failed:', e); }
        saveMatchResult(m);
        render();
      }, 600);
      return;
    }
    var ev = m.evs[i];
    state.evs = state.evs.concat([ev]);
    if (ev.type === 'goal') state.score = { h: ev.hS, a: ev.aS };

  }).join('');
 
  // KEY H2H
  var keyClashes=[{home:'NAP',away:'ACM',label:'Napoli vs Milan (MD31)'},{home:'INT',away:'ROM',label:'Inter vs Roma (MD31)'},{home:'COM',away:'INT',label:'Como vs Inter (MD32)'},{home:'ACM',away:'JUV',label:'Milan vs Juventus (MD34)'},{home:'COM',away:'NAP',label:'Como vs Napoli (MD35)'},{home:'COM',away:'ROM',label:'Como vs Roma (MD38)'}];
  var clashCards=keyClashes.map(function(c){var dc=dcAnalyse(c.home,c.away);var o=dc.outcomes;var top3=dc.topScores.slice(0,3);var hT2=TEAMS.find(function(t){return t.abbr===c.home;});var aT2=TEAMS.find(function(t){return t.abbr===c.away;});
    return'<div style="background:#0c1018;border:1px solid #181e28;padding:10px 12px"><div style="font-size:0.62rem;font-weight:600;margin-bottom:2px">'+c.label+'</div>'
      +'<div style="display:flex;justify-content:space-between;font-size:0.72rem;margin-bottom:2px"><span style="color:'+hT2.color+';font-weight:700">'+(o.homeWin*100).toFixed(1)+'%</span><span style="color:#ffd740">'+(o.draw*100).toFixed(1)+'%</span><span style="color:'+aT2.color+';font-weight:700">'+(o.awayWin*100).toFixed(1)+'%</span></div>'
      +'<div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin:6px 0"><div style="width:'+(o.homeWin*100).toFixed(1)+'%;background:'+hT2.color+'"></div><div style="width:'+(o.draw*100).toFixed(1)+'%;background:#ffd740"></div><div style="width:'+(o.awayWin*100).toFixed(1)+'%;background:'+aT2.color+'"></div></div>'
      +'<div style="font-size:0.52rem;color:#555;margin-bottom:4px">\u03BB '+dc.hL.toFixed(2)+' vs '+dc.aL.toFixed(2)+' \u2022 \u03C1='+dc.rho.toFixed(2)+'</div>'
      +'<div style="display:flex;gap:4px;flex-wrap:wrap">'+top3.map(function(s){return'<span style="font-size:0.6rem;padding:1px 5px;background:rgba(201,168,76,0.08);border:1px solid #c9a84c22;border-radius:2px;color:#c9a84c">'+s.h+'-'+s.a+' <span style="color:#555">'+(s.p*100).toFixed(1)+'%</span></span>';}).join('')+'</div></div>';
  }).join('');
 
  // METHODOLOGY
  var methodNote='<div style="background:#0c1018;border:1px solid #181e28;padding:14px 16px;margin-top:12px">'
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#c9a84c;margin-bottom:8px">Methodology: DC LLM vs Industry Models</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
    +'<div style="padding:10px 12px;background:#0e1318;border-left:2px solid #c9a84c"><div style="font-size:0.65rem;font-weight:600;color:#c9a84c;margin-bottom:4px">Our Model: LLM DC </div>'
    +'<div style="font-size:0.58rem;color:#777;line-height:1.6">\u2022 \u03C1 correction for low-score bias (0-0, 1-0, 1-1)<br>\u2022 Mismatch amplifiers for str gap > 35<br>\u2022 Defence collapse factor for weak away teams<br>\u2022 Tactical BLOCK_MU modifies \u03BB per matchup<br>\u2022 Analytical probabilities per match, MC for season paths<br>\u2022 \u03BB ceiling 3.2 allows 5-0 type scorelines</div></div>'
    +'<div style="padding:10px 12px;background:#0e1318;border-left:2px solid #555"><div style="font-size:0.65rem;font-weight:600;color:#aaa;margin-bottom:4px">Opta / StatsUltra / 538</div>'
    +'<div style="font-size:0.58rem;color:#777;line-height:1.6">\u2022 <span style="color:#aaa">Opta:</span> xPTS regression, ~15k daily sims<br>\u2022 <span style="color:#aaa">StatsUltra:</span> Elo + xG hybrid, 15k MC<br>\u2022 <span style="color:#aaa">538:</span> Global Club Elo, Bradley-Terry<br>\u2022 Independent Poisson (no \u03C1 correction)<br>\u2022 No tactical/pressing matchup adjustments<br>\u2022 No mismatch amplification for quality gaps</div></div></div>'
    +'<div style="margin-top:10px;padding:10px 12px;background:#0e1318;border-left:2px solid #69f0ae"><div style="font-size:0.62rem;font-weight:600;color:#69f0ae;margin-bottom:4px">Why Results Differ</div>'
    +'<div style="font-size:0.58rem;color:#777;line-height:1.65"><strong style="color:#c9a84c">Draw correction:</strong> DC \u03C1 < 0 increases low-score probability ~3-5%, more draws in tight matches. '
    +'<strong style="color:#c9a84c">Mismatch calibration:</strong> v2 amplifies \u03BB for large strength gaps (e.g. Como 82 vs Pisa 22 \u2192 \u03BB=3.2, predicting 2-0/3-0 correctly). '
    +'<strong style="color:#c9a84c">Tactical matchups:</strong> BLOCK_MU adjusts \u03BB based on pressing style (Milan low block vs Napoli high press = \u00D70.85). '
    +'<strong style="color:#c9a84c">Injury impact:</strong> NAP missing Di Lorenzo + Rrahmani for MD31-33 costs ~14 str points.</div></div></div>';
 
  return'<div>'
    +'<div style="font-family:Georgia,serif;font-size:1.25rem;font-weight:700;margin-bottom:3px">AI SIM</div>'
    +'<div style="font-size:0.65rem;color:#555;margin-bottom:16px">10,000 simulations \u2022 Mismatch-calibrated DC matrices \u2022 Exact analytical match probabilities</div>'
    +btn
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#c9a84c;margin-bottom:8px">Scudetto Race</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">'+titleCards+'</div>'
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#003399;margin-bottom:8px;margin-top:14px">Champions League Spots (Top 4)</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">'+clCards+'</div>'
    +'<div style="background:#0c1018;border:1px solid #181e28;padding:14px 16px;margin-bottom:14px"><div style="font-size:0.56rem;letter-spacing:0.12em;text-transform:uppercase;color:#555;margin-bottom:12px">Projected Final Points Range</div>'+ptsBars+'</div>'
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#c9a84c;margin-bottom:8px;margin-top:14px">Key H2H Clashes \u2022 DC v2 Exact Probabilities</div>'
    +'<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px">'+clashCards+'</div>'
    +'<div style="background:#0c1018;border:1px solid #181e28;padding:14px 16px;margin-bottom:12px;border-top:2px solid #1a1e24">'
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#c9a84c;margin-bottom:4px">Model Comparison \u2022 Title Probability \u2022 MD31</div>'
    +'<div style="font-size:0.56rem;color:#444;margin-bottom:12px">LLM DC v2 vs industry models. All figures post-MD30.</div>'
    +'<div style="display:grid;grid-template-columns:110px repeat(6,1fr);gap:2px;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid #151b25"><div></div>'+compHeaderCells+'</div>'
    +compRows+'</div>'
    +'<div style="background:#0c1018;border:1px solid #181e28;padding:14px 16px;margin-bottom:12px">'
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#555;margin-bottom:4px">Projected Final Points \u2022 Opta vs DC v2</div>'
    +'<div style="font-size:0.52rem;color:#444;margin-bottom:12px"><span style="display:inline-block;width:8px;height:8px;background:#4488cc;border-radius:1px;margin-right:3px"></span>Current <span style="display:inline-block;width:8px;height:8px;background:#c9a84c44;border-radius:1px;margin-left:8px;margin-right:3px"></span>DC v2 Projected <span style="display:inline-block;width:8px;height:8px;background:#ffffff11;border-radius:1px;margin-left:8px;margin-right:3px"></span>Opta Projected</div>'
    +optaBars+'</div>'
    +methodNote
    +'<div style="font-size:0.56rem;color:#333;margin-top:10px;text-align:center">'+mc.ties+' tiebreak scenarios in '+mc.n+' sims \u2022 DC v2 \u03C1-corrected + mismatch-calibrated</div></div>';
}
 
// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
 
function setTab(t){state.tab=t;render();}
 
function render(){
  var TABS=[['runin','Run-In'],['predicted','Predicted Score'],['stats','Stats'],['tactics','Tactics'],['simulator','Simulator'],['monte','10000 Scenarios']];
  var tabBtns=TABS.map(function(item){return'<button class="T'+(state.tab===item[0]?' on':'')+'" data-action="tab-'+item[0]+'">'+item[1]+'</button>';}).join('');
  var content='';
  if(state.tab==='runin')content=renderRunIn();
  else if(state.tab==='predicted')content=renderPredicted();
  else if(state.tab==='stats')content=renderStats();
  else if(state.tab==='tactics')content=renderTactics();
  else if(state.tab==='simulator')content=renderSimulator();
  else if(state.tab==='monte')content=renderMonte();
 
  document.getElementById('root').innerHTML=
    '<div style="min-height:100vh;background:#07090d;color:#e0d8cc">'
    +'<div style="background:#0e1520;border-bottom:1px solid #151b25;padding:18px 24px 0"><div style="max-width:980px;margin:0 auto">'
    +'<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">'
    +'<h1 style="font-family:Georgia,serif;font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#c9a84c,#e8d08a);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CALCIO SIM</h1>'
    +'<span style="font-size:0.58rem;color:#444;letter-spacing:0.18em;text-transform:uppercase">Serie A 2025/26 \u2022 MD31 \u2022 LLM DC v2</span></div>'
    +'<div style="display:flex;border-bottom:1px solid #151b25;overflow-x:auto">'+tabBtns+'</div></div></div>'
    +'<div style="max-width:980px;margin:0 auto;padding:20px 16px">'+content+'</div></div>';
}
// ═══════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════
 
document.addEventListener('click', function(e) {
  var el = e.target;
  while (el && el !== document) {
    var ac = el.getAttribute && el.getAttribute('data-action');
    if (ac) {
      if (ac === 'runin') { doRunIn(); return; }
      if (ac === 'mc') { doMC(); return; }
      if (ac === 'kickoff') { if (!el.disabled) doKickOff(); return; }
      if (ac.indexOf('tab-') === 0) { setTab(ac.slice(4)); return; }
      if (ac === 'lockPred') {
        var ph2 = document.getElementById('pred_h'), pa2 = document.getElementById('pred_a');
        if (ph2 && pa2 && ph2.value !== '' && pa2.value !== '') {
          state.pred.h = ph2.value; state.pred.a = pa2.value;
          state.pred.locked = true; state.pred.lastMsg = '';
        }
        render(); return;
      }
      if (ac === 'unlockPred') {
        state.pred.locked = false; state.pred.lastMsg = '';
        render(); return;
      }
      if (ac === 'newMatch') {
        state.match = null; state.evs = []; state.score = { h: 0, a: 0 };
        state.playing = false; state.fin = false;
        state.pred.locked = false; state.pred.h = ''; state.pred.a = '';
        state.pred.lastMsg = ''; state.pred.lastReward = 0;
        if (playInterval) { clearInterval(playInterval); playInterval = null; }
        render(); return;
      }
    }
    el = el.parentNode;
  }
});
 
document.addEventListener('change', function(e) {
  var el = e.target;
  if (el && el.getAttribute) {
    var ac = el.getAttribute('data-action');
    if (ac === 'selchange') {
      var sh = document.getElementById('sh'), sa = document.getElementById('sa');
      if (sh) state.home = sh.value; if (sa) state.away = sa.value;
      state.match = null; state.evs = []; state.score = { h: 0, a: 0 };
      state.fin = false; state.playing = false;
      state.pred.locked = false; state.pred.h = ''; state.pred.a = ''; state.pred.lastMsg = '';
      if (playInterval) { clearInterval(playInterval); playInterval = null; }
      render();
    }
    if (ac === 'predchange') {
      var phx = document.getElementById('ph'), pax = document.getElementById('pa');
      if (phx) state.predHome = phx.value; if (pax) state.predAway = pax.value;
      render();
    }
    if (ac === 'simSetting') {
      if (el.id === 'sim_homeFormation') state.sim.homeFormation = el.value;
      else if (el.id === 'sim_awayFormation') state.sim.awayFormation = el.value;
      else if (el.id === 'sim_weather') state.sim.weather = el.value;
      render();
    }
    if (ac === 'simCheck') {
      if (el.id === 'sim_homeAdv') state.sim.homeAdvantage = el.checked;
      if (el.id === 'sim_rivalry') state.sim.rivalry = el.checked;
    }
    // Sliders: only update state + full render on RELEASE (change event)
    if (ac === 'simSlider') {
      var v2 = parseInt(el.value, 10);
      if (el.id === 'sim_homeRotation') state.sim.homeRotation = v2;
      else if (el.id === 'sim_awayRotation') state.sim.awayRotation = v2;
      else if (el.id === 'sim_homeMorale') state.sim.homeMorale = v2;
      else if (el.id === 'sim_awayMorale') state.sim.awayMorale = v2;
      else if (el.id === 'sim_refStrictness') state.sim.refStrictness = v2;
      render();
    }
  }
});
 
// Sliders: live visual update ONLY (no render, no DOM rebuild) while dragging
document.addEventListener('input', function(e) {
  var el = e.target;
  if (!el || !el.getAttribute) return;
  var ac = el.getAttribute('data-action');
 
  if (ac === 'simSlider') {
    var v = parseInt(el.value, 10);
    var col = v > 66 ? '#ff1744' : v > 33 ? '#ffd740' : '#00e676';
 
    // Update the value number display
    var wrap = el.closest('.sim-slider-wrap');
    if (wrap) {
      var valEl = wrap.querySelector('.sim-slider-val');
      if (valEl) { valEl.textContent = v; valEl.style.color = col; }
    }
 
    // Update slider track gradient
    el.style.background = '';
    var styleEl = el.nextElementSibling;
    // Just let the browser handle the native thumb position — gradient updates on change+render
  }
 
  if (ac === 'predInput') {
    if (el.id === 'pred_h') state.pred.h = el.value;
    if (el.id === 'pred_a') state.pred.a = el.value;
  }
});
 
document.addEventListener('DOMContentLoaded', function() {
  try { render(); trackSession(); loadMatchHistory(); }
  catch (e) {
    var root = document.getElementById('root');
    if (root) { root.style.cssText = 'background:#07090d;color:#ff1744;padding:20px;font-family:monospace'; root.innerHTML = '<h2>Error</h2><pre>' + e.message + '\n' + (e.stack || '') + '</pre>'; }
  }
});
  </script>
</body>
