h+='<span style="flex:1;font-size:.72rem;font-weight:'+(i<8?600:400)+'">'+esc(t.n)+'</span>';
h+='<span style="margin-right:4px">'+fbs(t.f)+'</span>';
h+='<span class="g" style="font-size:.8rem;font-weight:700;color:'+(i<4?"#69f0ae":"#aaa")+';min-width:24px;text-align:right">'+t.p+'</span></div>'});
return h}

function rRunIn(){
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:4px">CL Run-In Simulator</p>';
h+='<p style="font-size:.6rem;color:#555;margin-bottom:12px">6 games remaining · Top 4 qualify for Champions League</p>';
h+='<div class="g3" style="margin-bottom:12px">';
CL8.forEach(function(t){
h+='<div class="cd" style="padding:10px;border-top:2px solid '+t.c+'"><div style="font-size:.5rem;color:#555;text-transform:uppercase;letter-spacing:.08em">'+t.p+' pts</div><div style="font-size:.68rem;font-weight:600">'+esc(t.n)+'</div><div style="margin-top:3px">'+fbs(t.f)+'</div>';
if(S.sim&&S.sim[t.a]){var last=S.sim[t.a][S.sim[t.a].length-1];h+='<div style="font-size:.65rem;color:#69f0ae;margin-top:3px;font-weight:700">+'+last.c+' \u2192 '+(t.p+last.c)+'</div>'}
h+='</div>'});
h+='</div><div style="text-align:center;margin-bottom:14px"><button class="btn" onclick="doRI()">'+(S.sim?'Resimulate':'Simulate CL Run-In')+'</button></div>';
CL8.forEach(function(tm){if(!FX[tm.a])return;
h+='<div class="cd" style="margin-bottom:10px;overflow:hidden"><div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0e1318;border-bottom:1px solid #151b25"><div style="width:3px;height:24px;background:'+tm.c+';flex-shrink:0"></div><div style="flex:1"><div class="g" style="font-size:.85rem;font-weight:700">'+esc(tm.n)+'</div><div style="font-size:.55rem;color:#555">'+tm.p+'pts</div></div>';
if(S.sim&&S.sim[tm.a])h+='<div>'+S.sim[tm.a].map(function(r){return fb(r.r)}).join("")+'</div>';
h+='</div>';
FX[tm.a].forEach(function(fx,i){var r=S.sim?S.sim[tm.a][i]:null;var oT=tn(fx.o);
h+='<div style="display:flex;align-items:center;padding:5px 10px;border-bottom:1px solid #0d1117;gap:6px;background:'+(fx.b?"rgba(201,168,76,0.03)":"transparent")+'">';
h+='<span style="font-size:.55rem;color:#555;width:22px">'+fx.m+'</span><span style="font-size:.55rem;color:#555;width:42px">'+fx.d+'</span>';
h+='<span style="font-size:.72rem;flex:1;font-weight:'+(fx.b?600:400)+'">'+(fx.b?'\uD83D\uDD25 ':'')+esc(oT?oT.n:fx.o)+'</span>';
h+='<span style="font-size:.45rem;padding:2px 4px;background:'+(fx.h?"rgba(0,230,118,0.1)":"rgba(255,109,0,0.1)")+';color:'+(fx.h?"#00e676":"#ff6d00")+'">'+(fx.h?"H":"A")+'</span>';
if(r)h+='<span style="font-size:.58rem;font-weight:700;color:'+(r.r==="W"?"#00e676":r.r==="D"?"#ffd740":"#ff1744")+';min-width:18px;text-align:center">'+r.r+'</span>';
else h+='<span style="font-size:.5rem;color:#333;min-width:18px">-</span>';
h+='</div>'});h+='</div>'});
return h}

function rMC(){
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:4px">CL Qualification Probabilities</p>';
h+='<p style="font-size:.6rem;color:#555;margin-bottom:12px">10,000 sims · Dixon-Coles · Post-MD32 · 6 games left</p>';
h+='<div style="text-align:center;margin-bottom:14px"><button class="btn" onclick="doMC()">'+(S.mc?'Re-run 10k':'Run 10,000 Scenarios')+'</button></div>';
if(!S.mc)return h;
var mc=S.mc;
h+='<p class="sl" style="color:#003399">Champions League Qualification (Top 4)</p>';
CL8.slice().sort(function(a,b){return mc.cl[b.a]-mc.cl[a.a]}).forEach(function(t,i){
var p=pct(mc.cl[t.a]/mc.n);var inZone=parseFloat(p)>=50;
h+='<div class="cd" style="display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:4px;border-left:3px solid '+t.c+'">';
h+='<span style="font-size:.5rem;color:#555;width:20px">#'+(i+1)+'</span>';
h+='<span style="flex:1;font-size:.72rem;font-weight:600">'+esc(t.n)+' <span style="font-size:.55rem;color:#888">'+t.p+'pts</span></span>';
h+='<span class="g" style="font-size:1.2rem;font-weight:900;color:'+(inZone?"#69f0ae":parseFloat(p)>10?t.c:"#ff1744")+'">'+p+'%</span>';
h+='<span style="font-size:.45rem;color:#444;min-width:55px;text-align:right">'+mc.av[t.a]+' ('+mc.mn[t.a]+'-'+mc.mx[t.a]+')</span></div>'});
// Key clashes
h+='<p class="sl" style="margin-top:14px">Key CL-Deciding Clashes</p>';
var clashes=[{hm:"ACM",am:"JUV",md:34,t:"The 4th-place decider"},{hm:"COM",am:"NAP",md:35,t:"Can Como stay in the race?"},{hm:"COM",am:"ROM",md:38,t:"Final day drama?"}];
clashes.forEach(function(c){var an=ana(c.hm,c.am),hT=tn(c.hm),aT=tn(c.am);
h+='<div class="cd" style="padding:10px;margin-bottom:6px"><div style="font-size:.55rem;color:#888;margin-bottom:2px">MD'+c.md+' · '+c.t+'</div>';
h+='<div style="font-size:.7rem;font-weight:600;margin-bottom:4px">'+esc(hT.n)+' vs '+esc(aT.n)+'</div>';
h+='<div style="display:flex;justify-content:space-between;font-size:.72rem"><span style="color:'+hT.c+';font-weight:700">'+pct(an.o.hW)+'%</span><span style="color:#ffd740">'+pct(an.o.dr)+'%</span><span style="color:'+aT.c+';font-weight:700">'+pct(an.o.aW)+'%</span></div>';
h+='<div style="display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:4px"><div style="width:'+pct(an.o.hW)+'%;background:'+hT.c+'"></div><div style="width:'+pct(an.o.dr)+'%;background:#ffd740"></div><div style="width:'+pct(an.o.aW)+'%;background:'+aT.c+'"></div></div></div>'});
return h}

function rPred(){
var ha=S.pH,aa=S.pA;
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:12px">Predict & Analyse</p>';
h+='<div style="display:grid;grid-template-columns:1fr 30px 1fr;gap:6px;align-items:end;margin-bottom:14px"><div><div style="font-size:.48rem;color:#555;text-transform:uppercase;margin-bottom:3px">Home</div>'+sel("pH",ha)+'</div><div style="text-align:center;font-size:.7rem;color:#555;padding-bottom:8px">vs</div><div><div style="font-size:.48rem;color:#555;text-transform:uppercase;margin-bottom:3px">Away</div>'+sel("pA",aa)+'</div></div>';
if(ha===aa)return h+'<p style="text-align:center;color:#555;padding:30px">Select two different teams</p>';
var an=ana(ha,aa),hT=tn(ha),aT=tn(aa);
h+='<div style="background:linear-gradient(135deg,#0e1520,#0c1018);border:1px solid rgba(201,168,76,0.2);padding:14px;margin-bottom:12px;text-align:center"><div style="font-size:.48rem;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Expected Goals</div><div style="display:flex;justify-content:center;align-items:center;gap:16px"><div><div style="font-size:.5rem;color:'+hT.c+'">'+esc(hT.n)+'</div><div class="g" style="font-size:1.5rem;font-weight:900;color:'+hT.c+'">'+an.hL.toFixed(2)+'</div></div><div style="color:#333">|</div><div><div style="font-size:.5rem;color:#888">Total</div><div class="g go" style="font-size:1.5rem;font-weight:900">'+(an.hL+an.aL).toFixed(2)+'</div></div><div style="color:#333">|</div><div><div style="font-size:.5rem;color:'+aT.c+'">'+esc(aT.n)+'</div><div class="g" style="font-size:1.5rem;font-weight:900;color:'+aT.c+'">'+an.aL.toFixed(2)+'</div></div></div></div>';
h+='<div class="g3" style="margin-bottom:12px">';[["Home",an.o.hW,hT.c],["Draw",an.o.dr,"#ffd740"],["Away",an.o.aW,aT.c]].forEach(function(x){h+='<div class="cd" style="padding:10px;text-align:center;border-top:3px solid '+x[2]+'"><div style="font-size:.48rem;color:#555;text-transform:uppercase;margin-bottom:3px">'+x[0]+'</div><div class="g" style="font-size:1.4rem;font-weight:900;color:'+x[2]+'">'+pct(x[1])+'%</div></div>'});h+='</div>';
h+='<p class="sl">Most Likely Scorelines</p><div class="g4" style="margin-bottom:12px">';an.top.slice(0,8).forEach(function(sc,i){h+='<div class="cd" style="padding:8px;text-align:center;'+(i===0?'border-top:2px solid #c9a84c':'')+'"><div class="g" style="font-size:'+(i===0?'1.4rem':'1.1rem')+';font-weight:900;color:'+(i===0?'#c9a84c':'#e0d8cc')+'">'+sc.h+' - '+sc.a+'</div><div style="font-size:.6rem;color:#888">'+pct(sc.p)+'%</div></div>'});h+='</div>';
var btts=0,o25=0;for(var gh=0;gh<=8;gh++)for(var ga=0;ga<=8;ga++){var pp=an.mx[gh][ga]||0;if(gh>0&&ga>0)btts+=pp;if(gh+ga>2)o25+=pp}
h+='<div class="g2">';[["BTTS Yes",btts,"#69f0ae"],["BTTS No",1-btts,"#ff6d00"],["Over 2.5",o25,"#69f0ae"],["Under 2.5",1-o25,"#ff6d00"]].forEach(function(m){h+='<div class="cd" style="padding:8px;text-align:center"><div style="font-size:.48rem;color:#555;text-transform:uppercase">'+m[0]+'</div><div class="g" style="font-size:1rem;font-weight:700;color:'+m[2]+'">'+pct(m[1])+'%</div></div>'});h+='</div>';
return h}

function rSim(){
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:12px">H2H Simulator</p>';
h+='<div style="display:grid;grid-template-columns:1fr 30px 1fr;gap:6px;align-items:end;margin-bottom:12px"><div>'+sel("sH",S.sH)+'</div><div style="text-align:center;font-size:.7rem;color:#555;padding-bottom:8px">vs</div><div>'+sel("sA",S.sA)+'</div></div>';
var hT=tn(S.sH),aT=tn(S.sA);
h+='<div class="g2" style="margin-bottom:10px">';[hT,aT].forEach(function(t){if(!t)return;h+='<div class="cd" style="padding:8px"><div style="font-size:.6rem;color:#555;margin-bottom:3px">'+esc(t.n)+'</div><div>'+fbs(t.f)+'</div></div>'});h+='</div>';
h+='<div style="text-align:center;margin-bottom:12px"><button class="btn" onclick="doKick()"'+(S.sH===S.sA?' disabled':'')+'>'+(S.sm?'\u21BB Replay':'\u26BD Kick Off')+'</button></div>';
if(S.sm){var m=S.sm;h+='<div class="cd" style="padding:14px;margin-bottom:10px;text-align:center"><div style="font-size:.55rem;color:#555;margin-bottom:3px">Full Time</div><div class="g go" style="font-size:2.5rem;font-weight:900">'+m.hG+' - '+m.aG+'</div><div style="font-size:.65rem;color:#555">'+esc(m.hN)+' vs '+esc(m.aN)+'</div><div style="font-size:.5rem;color:#444;margin-top:4px">'+m.hW+'% / '+m.dr+'% / '+m.aW+'%</div><div style="margin-top:8px;text-align:left">';
if(!m.evs.length)h+='<div style="padding:8px;font-size:.65rem;color:#555;text-align:center">0-0</div>';
m.evs.forEach(function(e){h+='<div style="padding:4px 8px;font-size:.7rem;color:#c9a84c;border-bottom:1px solid #151b25">\u26BD '+e.min+"' <b>"+esc(e.sc)+'</b> <span style="color:#555;font-size:.55rem">('+e.hS+'-'+e.aS+')</span></div>'});
h+='</div></div>'}
if(S.sh.length){h+='<div class="cd" style="margin-top:8px"><div style="padding:6px 8px;font-size:.5rem;color:#555;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #151b25">History</div>';S.sh.forEach(function(x){h+='<div style="display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #0d1117;font-size:.68rem"><span style="color:#888">'+esc(x.h)+'</span><span class="go g" style="font-weight:700">'+x.hG+' - '+x.aG+'</span><span style="color:#888">'+esc(x.a)+'</span></div>'});h+='</div>'}
return h}

// MAIN RENDER
function render(){
var tabs=[["cl","CL Race"],["predict","Predict"],["simulate","Simulate"]];
var tabH='<div class="tabs">'+tabs.map(function(x){return'<button class="tab'+(S.tab===x[0]?" on":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>';
var content="";
if(S.tab==="cl"){
var svs=[["recap","MD32 Results"],["runin","CL Run-In"],["monte","10k CL Sims"]];
content='<div class="stabs">'+svs.map(function(x){return'<button class="stab'+(S.sv===x[0]?" on":"")+'" onclick="setSV(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>';
if(S.sv==="recap")content+=rRecap();else if(S.sv==="runin")content+=rRunIn();else content+=rMC();
}else if(S.tab==="predict")content=rPred();else content=rSim();
$("R").innerHTML='<div class="hdr"><div style="max-width:980px;margin:0 auto"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><h1 class="logo">CALCIO SIM</h1><span style="font-size:.5rem;color:#444;letter-spacing:.15em;text-transform:uppercase">Serie A 25/26 · Post-MD32 · CL Race</span></div>'+tabH+'</div></div><div class="wrap">'+content+'</div>';
var phE=$("pH"),paE=$("pA"),shE=$("sH"),saE=$("sA");
if(phE)phE.onchange=function(){S.pH=this.value;render()};
if(paE)paE.onchange=function(){S.pA=this.value;render()};
if(shE)shE.onchange=function(){S.sH=this.value;S.sm=null;render()};
if(saE)saE.onchange=function(){S.sA=this.value;S.sm=null;render()}}

function setTab(t){S.tab=t;render()}
function setSV(v){S.sv=v;render()}
function doMC(){S.mc=null;render();setTimeout(function(){S.mc=mcRun(10000);render()},30)}
function doRI(){
var h2={};H2H.forEach(function(c){var o=ana(c.hm,c.am).o;var r=Math.random();h2[c.hm+"_"+c.am]=r<o.hW?"W":r<o.hW+o.dr?"D":"L"});
var res={};CL8.forEach(function(t){if(!FX[t.a])return;var cum=0;
res[t.a]=FX[t.a].map(function(fx){
var hk="";H2H.forEach(function(c){if(c.hm===t.a&&c.am===fx.o)hk=c.hm+"_"+c.am;if(c.am===t.a&&c.hm===fx.o)hk=c.hm+"_"+c.am});
var r2;if(hk){var hr=h2[hk];r2=t.a===hk.split("_")[0]?hr:(hr==="W"?"L":hr==="L"?"W":"D")}
else{var ha=fx.h?t.a:fx.o,aa=fx.h?fx.o:t.a;var o=ana(ha,aa).o;var rr=Math.random();var raw=rr<o.hW?"W":rr<o.hW+o.dr?"D":"L";r2=fx.h?raw:(raw==="W"?"L":raw==="L"?"W":"D")}
cum+=r2==="W"?3:r2==="D"?1:0;return{r:r2,c:cum}})});
S.sim=res;render()}
function doKick(){
if(S.sH===S.sA)return;var an=ana(S.sH,S.sA);var sc=samp(an.mx);var hT=tn(S.sH),aT=tn(S.sA);
var mins=[];for(var i=1;i<=90;i++)mins.push(i);mins.sort(function(){return Math.random()-.5});
var gm=mins.slice(0,sc.h+sc.a).sort(function(a,b){return a-b});
var sides=[];for(i=0;i<sc.h;i++)sides.push("H");for(i=0;i<sc.a;i++)sides.push("A");sides.sort(function(){return Math.random()-.5});
var hs=0,as2=0;var evs=gm.map(function(min,idx){var isH=sides[idx]==="H";if(isH)hs++;else as2++;var ab=isH?S.sH:S.sA;var ro=RO[ab]||["Unknown"];return{min:min,sc:ro[Math.floor(Math.random()*ro.length)],hS:hs,aS:as2}});
S.sm={hG:sc.h,aG:sc.a,evs:evs,hN:hT.n,aN:aT.n,hW:pct(an.o.hW),dr:pct(an.o.dr),aW:pct(an.o.aW)};
S.sh=[{h:hT.n,a:aT.n,hG:sc.h,aG:sc.a}].concat(S.sh.slice(0,4));render()}
render();
</script>
</body>
