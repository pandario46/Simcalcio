function wcDecay(currentMD,elimMD,decayRate){return Math.pow(1-decayRate,Math.max(0,currentMD-elimMD));}
function wcPlayerDamage(td){if(!td||!td.players||!td.players.length)return 0;var d=0;td.players.forEach(function(p){d+=(WC_ROLE[p.clubRole]||0.3)*(SEVERITY_MULT[p.severity]||0.5);});return d;}
function wcMoraleFactor(abbr,md){var td=WC_MORALE[abbr];if(!td)return 1.0;var currentMD=md||WC_CONFIG.currentMD;var decay=wcDecay(currentMD,WC_CONFIG.eliminationMD,WC_CONFIG.decayRate);var playerDmg=wcPlayerDamage(td)*0.035;var ambientDmg=(td.italianCorePct||0)*0.02;var sentimentDmg=Math.max(0,-(td.netSentiment||0))*0.015;var raw=playerDmg+ambientDmg+sentimentDmg;return Math.max(0.88,1.0-raw*decay);}

function poissonPMF(k,lambda){if(k<0||lambda<=0)return 0;var logP=-lambda+k*Math.log(lambda);for(var i=2;i<=k;i++)logP-=Math.log(i);return Math.exp(logP);}
function dcTau(h,a,lH,lA,rho){if(h===0&&a===0)return 1-lH*lA*rho;if(h===1&&a===0)return 1+lA*rho;if(h===0&&a===1)return 1+lH*rho;if(h===1&&a===1)return 1-rho;return 1;}
function dcMatrix(lH,lA,rho){var mx=[],total=0;for(var h=0;h<=8;h++){mx[h]=[];for(var a=0;a<=8;a++){mx[h][a]=poissonPMF(h,lH)*poissonPMF(a,lA)*dcTau(h,a,lH,lA,rho);total+=mx[h][a];}}for(var h2=0;h2<=8;h2++)for(var a2=0;a2<=8;a2++)mx[h2][a2]/=total;return mx;}
function dcOutcomes(mx){var hW=0,dr=0,aW=0;for(var h=0;h<=8;h++)for(var a=0;a<=8;a++){if(h>a)hW+=mx[h][a];else if(h===a)dr+=mx[h][a];else aW+=mx[h][a];}return{homeWin:hW,draw:dr,awayWin:aW};}
function dcTopScores(mx,n){var scores=[];for(var h=0;h<=7;h++)for(var a=0;a<=7;a++)scores.push({h:h,a:a,p:mx[h][a]});scores.sort(function(x,y){return y.p-x.p;});return scores.slice(0,n||10);}
function dcSample(mx){var r=Math.random(),cum=0;for(var h=0;h<=8;h++)for(var a=0;a<=8;a++){cum+=mx[h][a];if(r<cum)return{h:h,a:a};}return{h:0,a:0};}

function mismatchFactor(myStr,oppStr){var gap=myStr-oppStr;if(gap<=0)return 1.0;return 1.0+Math.pow(gap/100,1.2)*0.8;}
function defCollapseMultiplier(oppStr){if(oppStr>=35)return 1.0;return 1.0+Math.pow((35-oppStr)/35,1.2)*0.25;}

function dcLambdas(ha,aa,md){
var hA=ADV[ha]||{};var aA=ADV[aa]||{};
var hS2=hA.str||OPP[ha]||50;var aS2=aA.str||OPP[aa]||50;
var hWCStr=wcMoraleFactor(ha,md);var aWCStr=wcMoraleFactor(aa,md);
if(hWCStr<1.0)hS2=hS2*(0.5+0.5*hWCStr);if(aWCStr<1.0)aS2=aS2*(0.5+0.5*aWCStr);
var hTD=TDATA[ha]||{bk:"medium"};var aTD=TDATA[aa]||{bk:"medium"};
var muH=BLOCK_MU[hTD.bk+"_vs_"+aTD.bk]||{gm:1.0,label:""};var muA=BLOCK_MU[aTD.bk+"_vs_"+hTD.bk]||{gm:1.0,label:""};
var hXG=hA.xG||(GXG[ha]?GXG[ha].xg:1.21);var hXGA=hA.xGA||(GXG[ha]?GXG[ha].xga:1.21);
var aXG=aA.xG||(GXG[aa]?GXG[aa].xg:1.21);var aXGA=aA.xGA||(GXG[aa]?GXG[aa].xga:1.21);
var hAtt=hXG/1.21;var hDef=1.21/Math.max(aXGA,0.5);var aAtt=aXG/1.21;var aDef=1.21/Math.max(hXGA,0.5);
var strGap=Math.abs(hS2-aS2);var strExp=0.18+Math.min(strGap,60)*0.002;
var strRatio=Math.pow(Math.max(hS2,1)/Math.max(aS2,1),strExp);
var hMismatch=mismatchFactor(hS2,aS2);var aMismatch=mismatchFactor(aS2,hS2);
var aDefCollapse=defCollapseMultiplier(aS2);var hDefCollapse=defCollapseMultiplier(hS2);
var hL=1.24*Math.sqrt(hAtt*hDef)*strRatio*muH.gm*hMismatch*aDefCollapse;
var aL=1.18*Math.sqrt(aAtt*aDef)*(1/strRatio)*muA.gm*aMismatch*hDefCollapse;
hL=Math.min(3.0,Math.max(0.35,hL));aL=Math.min(3.0,Math.max(0.35,aL));
var hWC=wcMoraleFactor(ha,md);var aWC=wcMoraleFactor(aa,md);
hL=hL*hWC;aL=aL*aWC;
if(strGap>25){var suppression=1.0-Math.min((strGap-25)/60,0.40);if(hS2>aS2)aL=Math.max(0.35,aL*suppression);else hL=Math.max(0.35,hL*suppression);}
var avgGm=(muH.gm+muA.gm)/2;var rho;
if(strGap>40)rho=-0.03;else if(strGap>20)rho=-0.06;else if(avgGm>1.1)rho=-0.05;else if(avgGm<0.85)rho=-0.14;else rho=-0.10;
return{hL:hL,aL:aL,rho:rho,muH:muH,muA:muA,hTD:hTD,aTD:aTD};
}

function dcAnalyse(ha,aa,md){var params=dcLambdas(ha,aa,md);var matrix=dcMatrix(params.hL,params.aL,params.rho);var outcomes=dcOutcomes(matrix);var topScores=dcTopScores(matrix,12);return{matrix:matrix,outcomes:outcomes,topScores:topScores,hL:params.hL,aL:params.aL,rho:params.rho,muH:params.muH,muA:params.muA,hTD:params.hTD,aTD:params.aTD};}

function fscore(form){var weights=[1,1,1,2,3],pts=0,total=0;for(var i=0;i<form.length;i++){var w=weights[i]||1;pts+=(form[i]==='W'?3:form[i]==='D'?1:0)*w;total+=3*w;}return pts/total;}
function probs(abbr,fx){var t=TEAMS.find(function(x){return x.abbr===abbr;});var ha=fx.h?abbr:fx.oppAbbr,aa=fx.h?fx.oppAbbr:abbr;var dc=dcAnalyse(ha,aa);var o=dc.outcomes;var winP,drawP,lossP;if(fx.h){winP=o.homeWin*100;drawP=o.draw*100;lossP=o.awayWin*100;}else{winP=o.awayWin*100;drawP=o.draw*100;lossP=o.homeWin*100;}var formBonus=fscore(t.form);var formAdj=(formBonus-0.5)*6;winP=Math.min(92,Math.max(3,winP+formAdj));lossP=Math.max(2,lossP-formAdj*0.4);drawP=Math.max(4,100-winP-lossP);var tot=winP+drawP+lossP;return{winP:winP/tot*100,drawP:drawP/tot*100,lossP:lossP/tot*100};}

var hT=TEAMS.find(function(t){return t.abbr===state.home;});var aT=TEAMS.find(function(t){return t.abbr===state.away;});
var hM=getMomentum(hT.form),aM=getMomentum(aT.form);
var teamCards='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+[{t:hT,m:hM},{t:aT,m:aM}].map(function(x){return'<div style="background:#0c1018;border:1px solid #181e28;padding:10px"><div style="font-size:0.6rem;color:#555;margin-bottom:4px">'+esc(x.t.name)+'</div><div style="display:flex;gap:3px;margin-bottom:5px">'+x.t.form.map(colorBox).join('')+'</div><div style="font-size:0.65rem;color:'+x.m.color+'">'+x.m.emoji+' '+x.m.label+'</div></div>';}).join('')+'</div>';
var preProbs='';
if(!state.match&&hT.abbr!==aT.abbr){var dc=dcAnalyse(state.home,state.away);var o=dc.outcomes;var topS=dc.topScores.slice(0,3);preProbs='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px">'+[['Win',o.homeWin,'#00e676'],['Draw',o.draw,'#ffd740'],['Loss',o.awayWin,'#ff1744']].map(function(x){return'<div style="background:#0c1018;border:1px solid #181e28;padding:10px;text-align:center"><div style="font-size:0.54rem;color:#555;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">'+x[0]+'</div><div style="font-family:Georgia,serif;font-size:1.4rem;font-weight:700;color:'+x[2]+'">'+(x[1]*100).toFixed(1)+'%</div></div>';}).join('')+'</div>';}
var matchArea='';
if(state.match){matchArea='<div style="background:#0c1018;border:1px solid #181e28;padding:18px 20px;margin-bottom:8px;text-align:center"><div style="font-size:0.6rem;color:#555;margin-bottom:4px">'+(state.fin?'Full Time':'<span class="pulse" style="color:#ff1744;font-size:0.7rem">\u25CF LIVE</span>')+'</div><div style="font-family:Georgia,serif;font-size:3rem;font-weight:900;color:#c9a84c" id="ls">'+state.score.h+' - '+state.score.a+'</div><div style="font-size:0.72rem;color:#555;margin-top:4px">'+esc(state.match.hTeam.name)+' vs '+esc(state.match.aTeam.name)+'</div></div><div id="feed" style="max-height:280px;overflow-y:auto;margin-bottom:8px"></div>';}
var histRows=state.hist.length?state.hist.map(function(h){return'<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-bottom:1px solid #0d1117;font-size:0.7rem"><span style="color:#888">'+esc(h.home)+'</span><span style="color:#c9a84c;font-weight:700">'+h.hG+' - '+h.aG+'</span><span style="color:#888">'+esc(h.away)+'</span></div>';}).join(''):'';
var btnArea='<div style="text-align:center;margin-bottom:14px"><button class="B" data-action="kickoff" '+(state.home===state.away||state.playing?'disabled':'')+'>'+(state.playing?'\u25CF Live\u2026':state.fin?'\u21BA Replay':'\u26BD Kick Off')+'</button>';
if(state.fin)btnArea+=' <button class="B" data-action="newMatch" style="background:#1a1f2e;border:1px solid #252b38;margin-left:8px">New Match</button>';
btnArea+='</div>';
return'<div><div style="font-family:Georgia,serif;font-size:1.25rem;font-weight:700;margin-bottom:16px">H2H Simulator</div><div style="display:grid;grid-template-columns:1fr 40px 1fr;gap:8px;align-items:end;margin-bottom:12px"><div>'+buildSelect('sh',state.home)+'</div><div style="text-align:center;font-size:0.7rem;color:#555;padding-bottom:10px">vs</div><div>'+buildSelect('sa',state.away)+'</div></div>'+teamCards+preProbs+btnArea+matchArea+(state.hist.length?'<div style="background:#0c1018;border:1px solid #181e28;margin-top:8px"><div style="padding:8px 10px;font-size:0.58rem;color:#555;letter-spacing:0.1em;text-transform:uppercase;border-bottom:1px solid #151b25">Match History</div>'+histRows+'</div>':'')+'</div>';
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function setTab(t){state.tab=t;render();}
function render(){
var TABS=[['title','Title Race'],['predict','Predict'],['simulate','Simulate']];
var tabBtns=TABS.map(function(item){return'<button class="T'+(state.tab===item[0]?' on':'')+'" data-action="tab-'+item[0]+'">'+item[1]+'</button>';}).join('');
var content='';
if(state.tab==='title')content=renderTitleRace();
else if(state.tab==='predict')content=renderPredict();
else if(state.tab==='simulate')content=renderSimulator();
document.getElementById('root').innerHTML='<div style="min-height:100vh;background:#07090d;color:#e0d8cc"><div style="background:#0e1520;border-bottom:1px solid #151b25;padding:18px 24px 0"><div style="max-width:980px;margin:0 auto"><div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px"><h1 style="font-family:Georgia,serif;font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#c9a84c,#e8d08a);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CALCIO SIM</h1><span style="font-size:0.58rem;color:#444;letter-spacing:0.18em;text-transform:uppercase">Serie A 2025/26 \u2022 Post-MD31 \u2022 DC v2</span></div><div style="display:flex;border-bottom:1px solid #151b25;overflow-x:auto">'+tabBtns+'</div></div></div><div style="max-width:980px;margin:0 auto;padding:20px 16px">'+content+'</div></div>';
}

// ═══════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════
document.addEventListener('click',function(e){var el=e.target;while(el&&el!==document){var ac=el.getAttribute&&el.getAttribute('data-action');if(ac){
if(ac==='runin'){doRunIn();return;}if(ac==='mc'){doMC();return;}if(ac==='kickoff'){if(!el.disabled)doKickOff();return;}
if(ac.indexOf('tab-')===0){setTab(ac.slice(4));return;}
if(ac==='titleView-runin'){state.titleView='runin';render();return;}if(ac==='titleView-monte'){state.titleView='monte';render();return;}
if(ac==='newMatch'){state.match=null;state.evs=[];state.score={h:0,a:0};state.playing=false;state.fin=false;if(playInterval){clearInterval(playInterval);playInterval=null;}render();return;}
}el=el.parentNode;}});
document.addEventListener('change',function(e){var el=e.target;if(el&&el.getAttribute){var ac=el.getAttribute('data-action');
if(ac==='selchange'){var sh=document.getElementById('sh'),sa=document.getElementById('sa');if(sh)state.home=sh.value;if(sa)state.away=sa.value;state.match=null;state.evs=[];state.score={h:0,a:0};state.fin=false;state.playing=false;if(playInterval){clearInterval(playInterval);playInterval=null;}render();}
if(ac==='predchange'){var phx=document.getElementById('ph'),pax=document.getElementById('pa');if(phx)state.predHome=phx.value;if(pax)state.predAway=pax.value;render();}
}});
document.addEventListener('DOMContentLoaded',function(){try{render();}catch(e){var root=document.getElementById('root');if(root){root.style.cssText='background:#07090d;color:#ff1744;padding:20px;font-family:monospace';root.innerHTML='<h2>Error</h2><pre>'+e.message+'\n'+(e.stack||'')+'</pre>';}}});

  </script>
</body>
</html>
