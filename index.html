// — CALIBRATED TO SERIE A 2025-26 ACTUALS ––––––––––––––––
// Real league stats: Home wins 39% . Draws 26% . Away wins 34% . Avg goals 2.45
// Home avg goals ~1.30 . Away avg goals ~1.15
// —————————————————————————–

// Recency-weighted form: last game x3, second-to-last x2, rest x1
function fscore(form) {
var weights = [1, 1, 1, 2, 3]; // oldest to most recent
var pts = 0, total = 0;
for (var i = 0; i < form.length; i++) {
var w = weights[i] || 1;
pts += (form[i] === “W” ? 3 : form[i] === “D” ? 1 : 0) * w;
total += 3 * w;
}
return pts / total; // 0.0 to 1.0
}

function probs(abbr, fx) {
var a = ADV[abbr] || {};
var t = TEAMS.find(function(x) { return x.abbr === abbr; });
var os = OPP[fx.oppAbbr] || 50;

// Injury penalties
var injStr = 0, injXG = 0;
var inj = INJURIES[abbr];
if (inj && fx.md && fx.md < inj.outUntilMd) { injStr = inj.strPenalty; injXG = inj.xGPenalty; }

var oppReduction = 0;
if (abbr === “INT” && fx.oppAbbr === “ROM” && fx.md === 31) { oppReduction = INJURIES.ROM_MD31_oppStrReduction; }

var myStr  = Math.max(1, (a.str || 50) - injStr);
var oppStr = Math.max(1, os - oppReduction);
var formBonus = fscore(t.form); // 0-1

// Stronger gap coefficient: 10pts = 0.32 log-odds (was 0.25, too weak for mismatches)
var strGap = myStr - oppStr;
var logOddsAdj = strGap * 0.032;

// Form: lighter weight (0.4 not 0.6) - season-long quality > 5-game form
logOddsAdj += (formBonus - 0.5) * 0.4;

// Home advantage: +0.25 home, -0.20 away
var homeAdj = fx.h ? 0.25 : -0.20;
logOddsAdj += homeAdj;

// xG quality bonus - small, max +/-0.12
var xgBonus = ((a.xG || 1.5) - 1.5) * 0.12 + (1.1 - (a.xGA || 1.1)) * 0.15 - injXG * 0.1;
logOddsAdj += xgBonus;

// Convert log-odds to win probability via logistic
var winP = 100 / (1 + Math.exp(-logOddsAdj));

// Draw: lower floor (6%), faster decay with gap - Serie A draws rare in mismatches
var drawBase = 26 - Math.abs(strGap) * 0.50 - Math.abs(formBonus - 0.5) * 4;
var drawP = Math.min(28, Math.max(6, drawBase));

// Higher win cap (85%, was 78%) - strong teams can dominate weak ones
var remaining = 100 - drawP;
var hWin = Math.min(85, Math.max(6, winP * remaining / 100));
var aWin = Math.max(4, remaining - hWin);

return { winP: hWin, drawP: drawP, lossP: aWin };
}

function roll(wp, dp) {
var r = Math.random() * 100;
if (r < wp) return “W”;
if (r < wp + dp) return “D”;
return “L”;
}

function poisson(lam) {
var L = Math.exp(-Math.min(lam, 10));
var k = 0, p = 1;
do { k++; p *= Math.random(); } while (p > L);
return k - 1;
}

function h2h(ha, aa) {
var hA = ADV[ha] || {};
var aA = ADV[aa] || {};
var hT = TEAMS.find(function(t) { return t.abbr === ha; });
var aT = TEAMS.find(function(t) { return t.abbr === aa; });
var hS = hA.str || OPP[ha] || 50;
var aS = aA.str || OPP[aa] || 50;
var hTD = TDATA[ha] || { bk:“medium”, block:“Medium Block”, ppda:11 };
var aTD = TDATA[aa] || { bk:“medium”, block:“Medium Block”, ppda:11 };
var muH = BLOCK_MU[hTD.bk + “*vs*” + aTD.bk] || { atk:0, gm:1.0, label:”” };
var muA = BLOCK_MU[aTD.bk + “*vs*” + hTD.bk] || { atk:0, gm:1.0, label:”” };

// Use real Statsbomb xG from ADV if available, else fall back to GXG estimates
var hXG  = hA.xG  || (GXG[ha]  ? GXG[ha].xg  : 1.21);
var hXGA = hA.xGA || (GXG[ha]  ? GXG[ha].xga : 1.21);
var aXG  = aA.xG  || (GXG[aa]  ? GXG[aa].xg  : 1.21);
var aXGA = aA.xGA || (GXG[aa]  ? GXG[aa].xga : 1.21);

// Geometric mean of attackxdefence ratios dampens extremes in top matchups
var hAtt = hXG  / 1.21;
var hDef = 1.21 / aXGA;
var aAtt = aXG  / 1.21;
var aDef = 1.21 / hXGA;

var strRatio = Math.pow(hS / Math.max(aS, 1), 0.15);

var hL = 1.30 * Math.sqrt(hAtt * hDef) * strRatio * muH.gm;
var aL = 1.15 * Math.sqrt(aAtt * aDef) * (1 / strRatio) * muA.gm;

// Clamp to realistic Serie A range (0.4-2.8 goals expected per team)
hL = Math.min(2.8, Math.max(0.4, hL));
aL = Math.min(2.8, Math.max(0.4, aL));

var hG = poisson(hL);
var aG = poisson(aL);
var mins = [];
for (var i = 1; i <= 90; i++) mins.push(i);
mins.sort(function() { return Math.random() - 0.5; });
var goalMins = mins.slice(0, hG + aG).sort(function(a, b) { return a - b; });
var sides = [];
for (var j = 0; j < hG; j++) sides.push(“H”);
for (var k = 0; k < aG; k++) sides.push(“A”);
sides.sort(function() { return Math.random() - 0.5; });
var hs = 0, as = 0;
var evs = goalMins.map(function(min, idx) {
var isH = sides[idx] === “H”;
if (isH) hs++; else as++;
var ab = isH ? ha : aa;
var ro = PL[ab] ? PL[ab].slice(1) : [“Unknown”]; // slice(1) skips GK at index 0
return { min:min, type:“goal”, team:ab, scorer:ro[Math.floor(Math.random() * ro.length)], hS:hs, aS:as };
});
var cMins = mins.slice(hG + aG, hG + aG + Math.floor(Math.random() * 4) + 1).sort(function(a, b) { return a - b; });
cMins.forEach(function(min) {
evs.push({ min:min, type:“yellow”, team:Math.random() > 0.5 ? ha : aa });
});
evs.sort(function(a, b) { return a.min - b.min; });

// Pre-match probabilities using calibrated probs()
var hProbs = probs(ha, { oppAbbr:aa, h:true, md:99 });
return { hG:hG, aG:aG, evs:evs, hW:Math.round(hProbs.winP), dP:Math.round(hProbs.drawP), aW:Math.round(hProbs.lossP), tacticLabel:muH.label, hBk:hTD.bk, aBk:aTD.bk, hBlock:hTD.block, aBlock:aTD.block, hTeam:hT, aTeam:aT };
}
