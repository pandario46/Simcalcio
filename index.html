function ppf(k,L){if(k<0||L<=0)return 0;var lp=-L+k*Math.log(L);for(var i=2;i<=k;i++)lp-=Math.log(i);return Math.exp(lp)}

h+='<span style="width:18px;font-size:.6rem;color:'+(i<4?"#c9a84c":"#555")+';font-weight:700">'+(i+1)+'</span>';
h+='<span style="width:4px;height:18px;background:'+t.c+';border-radius:1px;flex-shrink:0"></span>';
h+='<span style="flex:1;font-size:.72rem;font-weight:'+(i<6?600:400)+'">'+esc(t.n)+'</span>';
h+='<span style="margin-right:4px">'+fbs(t.f)+'</span>';
h+='<span style="font-size:.55rem;color:#888;margin-right:4px">'+t.w+'W</span>';
h+='<span class="g" style="font-size:.8rem;font-weight:700;color:'+(i<4?"#c9a84c":"#aaa")+';min-width:24px;text-align:right">'+t.p+'</span></div>';
});
return h;
}

function rRunIn(){
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:4px">Run-In Simulator</p>';
h+='<p style="font-size:.6rem;color:#555;margin-bottom:12px">7 games remaining · Inter 7pts clear</p>';
h+='<div class="grid3" style="margin-bottom:12px">';
T6.forEach(function(t){
h+='<div class="card" style="padding:10px;border-top:2px solid '+t.c+'">';
h+='<div style="font-size:.5rem;color:#555;text-transform:uppercase;letter-spacing:.08em">'+t.p+' pts</div>';
h+='<div style="font-size:.68rem;font-weight:600">'+esc(t.n)+'</div>';
h+='<div style="margin-top:3px">'+fbs(t.f)+'</div>';
if(S.sim&&S.sim[t.a]){var last=S.sim[t.a][S.sim[t.a].length-1];h+='<div style="font-size:.65rem;color:#69f0ae;margin-top:3px;font-weight:700">+'+last.c+' → '+(t.p+last.c)+'</div>'}
h+='</div>';
});
h+='</div><div style="text-align:center;margin-bottom:14px"><button class="btn" onclick="doRI()">'+(S.sim?'Resimulate':'Simulate Run-In')+'</button></div>';
T6.forEach(function(tm){
h+='<div class="card" style="margin-bottom:10px;overflow:hidden">';
h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0e1318;border-bottom:1px solid #151b25">';
h+='<div style="width:3px;height:24px;background:'+tm.c+';flex-shrink:0"></div>';
h+='<div style="flex:1"><div class="g" style="font-size:.85rem;font-weight:700">'+esc(tm.n)+'</div><div style="font-size:.55rem;color:#555">'+tm.p+'pts</div></div>';
if(S.sim&&S.sim[tm.a])h+='<div>'+S.sim[tm.a].map(function(r){return fb(r.r)}).join("")+'</div>';
h+='</div>';
FX[tm.a].forEach(function(fx,i){
var r=S.sim?S.sim[tm.a][i]:null;
var oT=tn(fx.o);
h+='<div style="display:flex;align-items:center;padding:5px 10px;border-bottom:1px solid #0d1117;gap:6px;background:'+(fx.b?"rgba(201,168,76,0.03)":"transparent")+'">';
h+='<span style="font-size:.55rem;color:#555;width:22px">'+fx.m+'</span>';
h+='<span style="font-size:.55rem;color:#555;width:42px">'+fx.d+'</span>';
h+='<span style="font-size:.72rem;flex:1;font-weight:'+(fx.b?600:400)+'">'+(fx.b?'\uD83D\uDD25 ':'')+esc(oT?oT.n:fx.o)+'</span>';
h+='<span style="font-size:.45rem;padding:2px 4px;background:'+(fx.h?"rgba(0,230,118,0.1)":"rgba(255,109,0,0.1)")+';color:'+(fx.h?"#00e676":"#ff6d00")+'">'+(fx.h?"H":"A")+'</span>';
if(r)h+='<span style="font-size:.58rem;font-weight:700;color:'+(r.r==="W"?"#00e676":r.r==="D"?"#ffd740":"#ff1744")+';min-width:18px;text-align:center">'+r.r+'</span>';
else h+='<span style="font-size:.5rem;color:#333;min-width:18px">-</span>';
h+='</div>';
});
h+='</div>';
});
return h;
}

function rMC(){
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:4px">Monte Carlo Simulation</p>';
h+='<p style="font-size:.6rem;color:#555;margin-bottom:12px">10,000 simulations · Dixon-Coles · Post-MD31</p>';
h+='<div style="text-align:center;margin-bottom:14px"><button class="btn" onclick="doMC()">'+(S.mc?'Re-run 10k':'Run 10,000 Scenarios')+'</button></div>';
if(!S.mc)return h;
var mc=S.mc;
h+='<p class="secl">Scudetto Race</p>';
var sorted=T6.slice().sort(function(a,b){return mc.ti[b.a]-mc.ti[a.a]});
sorted.forEach(function(t,i){
var p=pct(mc.ti[t.a]/mc.n);
h+='<div class="card" style="display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:4px;border-left:3px solid '+t.c+'">';
h+='<span style="font-size:.5rem;color:#555;width:20px">'+(i===0?'\uD83C\uDFC6':'#'+(i+1))+'</span>';
h+='<span style="flex:1;font-size:.72rem;font-weight:600">'+esc(t.n)+'</span>';
h+='<span class="g" style="font-size:1.1rem;font-weight:900;color:'+t.c+'">'+p+'%</span>';
h+='<span style="font-size:.48rem;color:#444;min-width:40px;text-align:right">'+mc.av[t.a]+' avg</span></div>';
});

h+='<p class="secl" style="margin-top:14px;color:#003399">Champions League (Top 4)</p>';
T6.slice().sort(function(a,b){return mc.cl[b.a]-mc.cl[a.a]}).forEach(function(t){
var p=pct(mc.cl[t.a]/mc.n);
h+='<div class="card" style="display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:3px;border-left:3px solid '+t.c+'">';
h+='<span style="flex:1;font-size:.7rem;font-weight:600">'+esc(t.n)+'</span>';
h+='<span class="g" style="font-size:.9rem;font-weight:700;color:'+(parseFloat(p)>90?"#00e676":t.c)+'">'+p+'%</span></div>';
});

h+='<p class="secl" style="margin-top:14px">Key H2H Clashes</p>';
H2H.forEach(function(c){
var an=ana(c.hm,c.am),hT=tn(c.hm),aT=tn(c.am);
h+='<div class="card" style="padding:10px;margin-bottom:6px">';
h+='<div style="font-size:.6rem;font-weight:600;margin-bottom:4px">'+esc(hT.n)+' vs '+esc(aT.n)+' (MD'+c.m+')</div>';
h+='<div style="display:flex;justify-content:space-between;font-size:.72rem"><span style="color:'+hT.c+';font-weight:700">'+pct(an.o.hW)+'%</span><span style="color:#ffd740">'+pct(an.o.dr)+'%</span><span style="color:'+aT.c+';font-weight:700">'+pct(an.o.aW)+'%</span></div>';
h+='<div style="display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:4px"><div style="width:'+pct(an.o.hW)+'%;background:'+hT.c+'"></div><div style="width:'+pct(an.o.dr)+'%;background:#ffd740"></div><div style="width:'+pct(an.o.aW)+'%;background:'+aT.c+'"></div></div></div>';
});
return h;
}

function rPred(){
var ha=S.pH,aa=S.pA;
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:12px">Predict & Analyse</p>';
h+='<div style="display:grid;grid-template-columns:1fr 30px 1fr;gap:6px;align-items:end;margin-bottom:14px">';
h+='<div><div style="font-size:.48rem;color:#555;text-transform:uppercase;margin-bottom:3px">Home</div>'+sel("pH",ha)+'</div>';
h+='<div style="text-align:center;font-size:.7rem;color:#555;padding-bottom:8px">vs</div>';
h+='<div><div style="font-size:.48rem;color:#555;text-transform:uppercase;margin-bottom:3px">Away</div>'+sel("pA",aa)+'</div></div>';
if(ha===aa)return h+'<p style="text-align:center;color:#555;padding:30px">Select two different teams</p>';
var an=ana(ha,aa),hT=tn(ha),aT=tn(aa);
// xG
h+='<div style="background:linear-gradient(135deg,#0e1520,#0c1018);border:1px solid rgba(201,168,76,0.2);padding:14px;margin-bottom:12px;text-align:center">';
h+='<div style="font-size:.48rem;color:#555;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px">Expected Goals</div>';
h+='<div style="display:flex;justify-content:center;align-items:center;gap:16px">';
h+='<div><div style="font-size:.5rem;color:'+hT.c+'">'+esc(hT.n)+'</div><div class="g" style="font-size:1.5rem;font-weight:900;color:'+hT.c+'">'+an.hL.toFixed(2)+'</div></div>';
h+='<div style="color:#333">|</div>';
h+='<div><div style="font-size:.5rem;color:#888">Total</div><div class="g gold" style="font-size:1.5rem;font-weight:900">'+(an.hL+an.aL).toFixed(2)+'</div></div>';
h+='<div style="color:#333">|</div>';
h+='<div><div style="font-size:.5rem;color:'+aT.c+'">'+esc(aT.n)+'</div><div class="g" style="font-size:1.5rem;font-weight:900;color:'+aT.c+'">'+an.aL.toFixed(2)+'</div></div>';
h+='</div></div>';
// outcomes
h+='<div class="grid3" style="margin-bottom:12px">';
[["Home",an.o.hW,hT.c],["Draw",an.o.dr,"#ffd740"],["Away",an.o.aW,aT.c]].forEach(function(x){
h+='<div class="card" style="padding:10px;text-align:center;border-top:3px solid '+x[2]+'"><div style="font-size:.48rem;color:#555;text-transform:uppercase;margin-bottom:3px">'+x[0]+'</div><div class="g" style="font-size:1.4rem;font-weight:900;color:'+x[2]+'">'+pct(x[1])+'%</div></div>';
});
h+='</div>';
// scorelines
h+='<p class="secl">Most Likely Scorelines</p><div class="grid4" style="margin-bottom:12px">';
an.top.slice(0,8).forEach(function(sc,i){
h+='<div class="card" style="padding:8px;text-align:center;'+(i===0?'border-top:2px solid #c9a84c;border-color:rgba(201,168,76,0.3)':'')+'">';
h+='<div class="g" style="font-size:'+(i===0?'1.4rem':'1.1rem')+';font-weight:900;color:'+(i===0?'#c9a84c':'#e0d8cc')+'">'+sc.h+' - '+sc.a+'</div>';
h+='<div style="font-size:.6rem;color:#888">'+pct(sc.p)+'%</div></div>';
});
h+='</div>';
// markets
var btts=0,o25=0;for(var gh=0;gh<=8;gh++)for(var ga=0;ga<=8;ga++){var pp=an.mx[gh][ga]||0;if(gh>0&&ga>0)btts+=pp;if(gh+ga>2)o25+=pp}
h+='<div class="grid2">';
[["BTTS Yes",btts,"#69f0ae"],["BTTS No",1-btts,"#ff6d00"],["Over 2.5",o25,"#69f0ae"],["Under 2.5",1-o25,"#ff6d00"]].forEach(function(m){
h+='<div class="card" style="padding:8px;text-align:center"><div style="font-size:.48rem;color:#555;text-transform:uppercase">'+m[0]+'</div><div class="g" style="font-size:1rem;font-weight:700;color:'+m[2]+'">'+pct(m[1])+'%</div></div>';
});
h+='</div>';
return h;
}

function rSim(){
var h='<p class="g" style="font-size:1.1rem;font-weight:700;margin-bottom:12px">H2H Simulator</p>';
h+='<div style="display:grid;grid-template-columns:1fr 30px 1fr;gap:6px;align-items:end;margin-bottom:12px">';
h+='<div>'+sel("sH",S.sH)+'</div><div style="text-align:center;font-size:.7rem;color:#555;padding-bottom:8px">vs</div><div>'+sel("sA",S.sA)+'</div></div>';
var hT=tn(S.sH),aT=tn(S.sA);
h+='<div class="grid2" style="margin-bottom:10px">';
[hT,aT].forEach(function(t){if(!t)return;h+='<div class="card" style="padding:8px"><div style="font-size:.6rem;color:#555;margin-bottom:3px">'+esc(t.n)+'</div><div>'+fbs(t.f)+'</div></div>'});
h+='</div>';
h+='<div style="text-align:center;margin-bottom:12px"><button class="btn" onclick="doKick()"'+(S.sH===S.sA?' disabled':'')+'>'+(S.sm?'\u21BB Replay':'\u26BD Kick Off')+'</button></div>';
if(S.sm){
var m=S.sm;
h+='<div class="card" style="padding:14px;margin-bottom:10px;text-align:center">';
h+='<div style="font-size:.55rem;color:#555;margin-bottom:3px">Full Time</div>';
h+='<div class="g gold" style="font-size:2.5rem;font-weight:900">'+m.hG+' - '+m.aG+'</div>';
h+='<div style="font-size:.65rem;color:#555">'+esc(m.hN)+' vs '+esc(m.aN)+'</div>';
h+='<div style="font-size:.5rem;color:#444;margin-top:4px">Pre-match: '+m.hW+'% / '+m.dr+'% / '+m.aW+'%</div>';
h+='<div style="margin-top:8px;text-align:left">';
if(m.evs.length===0)h+='<div style="padding:8px;font-size:.65rem;color:#555;text-align:center">0-0 — No goals scored</div>';
m.evs.forEach(function(e){
h+='<div style="padding:4px 8px;font-size:.7rem;color:#c9a84c;border-bottom:1px solid #151b25">\u26BD '+e.min+"\' <b>"+esc(e.sc)+'</b> <span style="color:#555;font-size:.55rem">('+e.hS+'-'+e.aS+')</span></div>';
});
h+='</div></div>';
}
if(S.sh.length){
h+='<div class="card" style="margin-top:8px"><div style="padding:6px 8px;font-size:.5rem;color:#555;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #151b25">History</div>';
S.sh.forEach(function(x){
h+='<div style="display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #0d1117;font-size:.68rem"><span style="color:#888">'+esc(x.h)+'</span><span class="gold g" style="font-weight:700">'+x.hG+' - '+x.aG+'</span><span style="color:#888">'+esc(x.a)+'</span></div>';
});
h+='</div>';
}
return h;
}

// ════════════════════════════════════════
// MAIN RENDER
// ════════════════════════════════════════
function render(){
var tabs=[["title","Title Race"],["predict","Predict"],["simulate","Simulate"]];
var tabH='<div class="tabs">'+tabs.map(function(x){return'<button class="tab'+(S.tab===x[0]?" on":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>';
var content="";
if(S.tab==="title"){
var svs=[["recap","MD31 Results"],["runin","Run-In"],["monte","10k Sims"]];
content='<div class="stabs">'+svs.map(function(x){return'<button class="stab'+(S.sv===x[0]?" on":"")+'" onclick="setSV(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>';
if(S.sv==="recap")content+=rRecap();
else if(S.sv==="runin")content+=rRunIn();
else content+=rMC();
}else if(S.tab==="predict"){
content=rPred();
}else{
content=rSim();
}
$("R").innerHTML='<div class="hdr"><div style="max-width:980px;margin:0 auto"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><h1 class="logo">CALCIO SIM</h1><span class="sub">Serie A 25/26 · Post-MD31</span></div>'+tabH+'</div></div><div class="wrap">'+content+'</div>';
// bind selects
var phE=$("pH"),paE=$("pA"),shE=$("sH"),saE=$("sA");
if(phE)phE.onchange=function(){S.pH=this.value;render()};
if(paE)paE.onchange=function(){S.pA=this.value;render()};
if(shE)shE.onchange=function(){S.sH=this.value;S.sm=null;render()};
if(saE)saE.onchange=function(){S.sA=this.value;S.sm=null;render()};
}

// ════════════════════════════════════════
// ACTIONS
// ════════════════════════════════════════
function setTab(t){S.tab=t;render()}
function setSV(v){S.sv=v;render()}

function doMC(){
S.mc=null;render();
setTimeout(function(){S.mc=mcRun(10000);render()},30);
}

function doRI(){
var h2={};
H2H.forEach(function(c){var o=ana(c.hm,c.am).o;var r=Math.random();h2[c.hm+"_"+c.am]=r<o.hW?"W":r<o.hW+o.dr?"D":"L"});
var res={};
T6.forEach(function(t){
var cum=0;
res[t.a]=FX[t.a].map(function(fx){
var hk="";H2H.forEach(function(c){if(c.hm===t.a&&c.am===fx.o)hk=c.hm+"_"+c.am;if(c.am===t.a&&c.hm===fx.o)hk=c.hm+"_"+c.am});
var r2;
if(hk){var hr=h2[hk];r2=t.a===hk.split("_")[0]?hr:(hr==="W"?"L":hr==="L"?"W":"D")}
else{var ha=fx.h?t.a:fx.o,aa=fx.h?fx.o:t.a;var o=ana(ha,aa).o;var rr=Math.random();var raw=rr<o.hW?"W":rr<o.hW+o.dr?"D":"L";r2=fx.h?raw:(raw==="W"?"L":raw==="L"?"W":"D")}
cum+=r2==="W"?3:r2==="D"?1:0;
return{r:r2,c:cum};
});
});
S.sim=res;render();
}

function doKick(){
if(S.sH===S.sA)return;
var an=ana(S.sH,S.sA);
var sc=samp(an.mx);
var hT=tn(S.sH),aT=tn(S.sA);
var mins=[];for(var i=1;i<=90;i++)mins.push(i);
mins.sort(function(){return Math.random()-.5});
var gm=mins.slice(0,sc.h+sc.a).sort(function(a,b){return a-b});
var sides=[];for(i=0;i<sc.h;i++)sides.push("H");for(i=0;i<sc.a;i++)sides.push("A");
sides.sort(function(){return Math.random()-.5});
var hs=0,as2=0;
var evs=gm.map(function(min,idx){
var isH=sides[idx]==="H";if(isH)hs++;else as2++;
var ab=isH?S.sH:S.sA;
var ro=RO[ab]||["Unknown"];
return{min:min,sc:ro[Math.floor(Math.random()*ro.length)],hS:hs,aS:as2};
});
S.sm={hG:sc.h,aG:sc.a,evs:evs,hN:hT.n,aN:aT.n,hW:pct(an.o.hW),dr:pct(an.o.dr),aW:pct(an.o.aW)};
S.sh=[{h:hT.n,a:aT.n,hG:sc.h,aG:sc.a}].concat(S.sh.slice(0,4));
render();
}

// ════════════════════════════════════════
// BOOT
// ════════════════════════════════════════
render();
</script>
</body>
</html>
