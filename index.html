function fscore(form) {
  var weights = [1, 1, 1, 2, 3];
  var pts = 0, total = 0;
  for (var i = 0; i < form.length; i++) {
    var w = weights[i] || 1;
    pts += (form[i] === "W" ? 3 : form[i] === "D" ? 1 : 0) * w;
    total += 3 * w;
  }
  return pts / total;
}
 
function probs(abbr, fx) {
  var a = ADV[abbr] || {};
  var t = TEAMS.find(function(x) { return x.abbr === abbr; });
  var os = OPP[fx.oppAbbr] || 50;
  var injStr = 0, injXG = 0;
  var inj = INJURIES[abbr];
  if (inj && fx.md && fx.md < inj.outUntilMd) { injStr = inj.strPenalty; injXG = inj.xGPenalty; }
  var oppReduction = 0;
  if (abbr === "INT" && fx.oppAbbr === "ROM" && fx.md === 31) { oppReduction = INJURIES.ROM_MD31_oppStrReduction; }
  var myStr  = Math.max(1, (a.str || 50) - injStr);
  var oppStr = Math.max(1, os - oppReduction);
  var formBonus = fscore(t.form);
  var strGap = myStr - oppStr;
  var logOddsAdj = strGap * 0.032;
  logOddsAdj += (formBonus - 0.5) * 0.4;
  var homeAdj = fx.h ? 0.25 : -0.20;
  logOddsAdj += homeAdj;
  var xgBonus = ((a.xG || 1.5) - 1.5) * 0.12 + (1.1 - (a.xGA || 1.1)) * 0.15 - injXG * 0.1;
  logOddsAdj += xgBonus;
  var winP = 100 / (1 + Math.exp(-logOddsAdj));
  var drawBase = 26 - Math.abs(strGap) * 0.50 - Math.abs(formBonus - 0.5) * 4;
  var drawP = Math.min(28, Math.max(6, drawBase));
  var remaining = 100 - drawP;
  var hWin = Math.min(85, Math.max(6, winP * remaining / 100));
  var aWin = Math.max(4, remaining - hWin);
  return { winP: hWin, drawP: drawP, lossP: aWin };
}
 
function roll(wp, dp) {
  var r = Math.random() * 100;
  if (r < wp) return "W";
  if (r < wp + dp) return "D";
  return "L";
}
 
function poisson(lam) {
  var L = Math.exp(-Math.min(lam, 10));
  var k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L);
  return k - 1;
}

  var hXGA = hA.xGA || (GXG[ha]  ? GXG[ha].xga : 1.21);

  var hAtt = hXG  / 1.21;
  var hDef = 1.21 / aXGA;
  var aAtt = aXG  / 1.21;
  var aDef = 1.21 / hXGA;
 
  var strRatio = Math.pow(hS / Math.max(aS, 1), 0.15);
  var hL = 1.30 * Math.sqrt(hAtt * hDef) * strRatio * muH.gm;
  var aL = 1.15 * Math.sqrt(aAtt * aDef) * (1 / strRatio) * muA.gm;
 
  hL = Math.min(2.8, Math.max(0.4, hL));
  aL = Math.min(2.8, Math.max(0.4, aL));
 
  var hG = poisson(hL);
  var aG = poisson(aL);
 
  var mins = [];
  for (var i = 1; i <= 90; i++) mins.push(i);
  mins.sort(function() { return Math.random() - 0.5; });
 
  var goalMins = mins.slice(0, hG + aG).sort(function(a, b) { return a - b; });
  var sides = [];
  for (var j = 0; j < hG; j++) sides.push("H");
  for (var k = 0; k < aG; k++) sides.push("A");
  sides.sort(function() { return Math.random() - 0.5; });
 
  var hs = 0, as = 0;
  var evs = goalMins.map(function(min, idx) {
    var isH = sides[idx] === "H";
    if (isH) hs++; else as++;
    var ab = isH ? ha : aa;
    var ro = PL[ab] ? PL[ab].slice(1) : ["Unknown"];
    return { min:min, type:"goal", team:ab, scorer:ro[Math.floor(Math.random() * ro.length)], hS:hs, aS:as };
  });
 
  var cMins = mins.slice(hG + aG, hG + aG + Math.floor(Math.random() * 4) + 1).sort(function(a, b) { return a - b; });
  cMins.forEach(function(min) {
    evs.push({ min:min, type:"yellow", team:Math.random() > 0.5 ? ha : aa });
  });
  evs.sort(function(a, b) { return a.min - b.min; });
 
  var hProbs = probs(ha, { oppAbbr:aa, h:true, md:99 });
  return {
    hG:hG, aG:aG, evs:evs,
    hW:Math.round(hProbs.winP), dP:Math.round(hProbs.drawP), aW:Math.round(hProbs.lossP),
    tacticLabel:muH.label,
    hBk:hTD.bk, aBk:aTD.bk, hBlock:hTD.block, aBlock:aTD.block,
    hTeam:hT, aTeam:aT
  };
}
 
var TOP4_H2H = [
  { md:31, home:"NAP", away:"ACM" },

function mcRun(n) {
  var titles  = { INT:0, NAP:0, ACM:0, COM:0, JUV:0, ROM:0 };
  var clSpots = { INT:0, NAP:0, ACM:0, COM:0, JUV:0, ROM:0 };
  var dist    = { INT:[], NAP:[], ACM:[], COM:[], JUV:[], ROM:[] };
  var ties = 0;
 
  for (var i = 0; i < n; i++) {
    var pts = { INT:69, NAP:62, ACM:63, COM:57, JUV:54, ROM:54 };
    var h2hResults = {};
 
    TOP4_H2H.forEach(function(clash) {
      var p = probs(clash.home, { oppAbbr: clash.away, h: true });
      var r = roll(p.winP, p.drawP);
      h2hResults[clash.home + "_" + clash.away] = r;
    });
 
    TOP6.forEach(function(t) {
      if (!FX[t.abbr]) return;
      FX[t.abbr].forEach(function(fx) {
        var h2hKey = "";
        TOP4_H2H.forEach(function(clash) {
          if (clash.home === t.abbr && clash.away === fx.oppAbbr) { h2hKey = clash.home + "_" + clash.away; }
          if (clash.away === t.abbr && clash.home === fx.oppAbbr) { h2hKey = clash.home + "_" + clash.away; }
        });
        if (h2hKey) {
          var homeRes = h2hResults[h2hKey];
          var myRes = t.abbr === h2hKey.split("_")[0] ? homeRes : (homeRes === "W" ? "L" : homeRes === "L" ? "W" : "D");
          pts[t.abbr] += myRes === "W" ? 3 : myRes === "D" ? 1 : 0;
        } else {
          var p = probs(t.abbr, fx);
          var r = roll(p.winP, p.drawP);
          pts[t.abbr] += r === "W" ? 3 : r === "D" ? 1 : 0;
        }
      });
    });
 
    TOP6.forEach(function(t) { dist[t.abbr].push(pts[t.abbr]); });
 
    var mx = Math.max(pts.INT, pts.NAP, pts.ACM, pts.COM, pts.JUV, pts.ROM);
    var winners = TOP6.filter(function(t) { return pts[t.abbr] === mx; });
    if (winners.length > 1) ties++;
    var w = winners.find(function(x) { return x.abbr === "INT"; }) || winners[0];
    titles[w.abbr]++;
 
    var ranked = TOP6.slice().sort(function(a, b) {
      if (pts[b.abbr] !== pts[a.abbr]) return pts[b.abbr] - pts[a.abbr];
      return a.rank - b.rank;
    });
    for (var j = 0; j < 4; j++) { clSpots[ranked[j].abbr]++; }
  }
 
  var avg = {}, mn = {}, mx2 = {};
  TOP6.forEach(function(t) {
    var d = dist[t.abbr];
    avg[t.abbr] = (d.reduce(function(a, b) { return a + b; }, 0) / d.length).toFixed(1);
    mn[t.abbr]  = Math.min.apply(null, d);
    mx2[t.abbr] = Math.max.apply(null, d);
  });
 
  return { titles:titles, clSpots:clSpots, n:n, ties:ties, avg:avg, mn:mn, mx:mx2 };
}

function doRunIn() {
  var h2hResults = {};
  TOP4_H2H.forEach(function(clash) {
    var p = probs(clash.home, { oppAbbr: clash.away, h: true, md:99 });
    var r = roll(p.winP, p.drawP);
    // ✅ FIX: Use underscore separator consistently
    h2hResults[clash.home + '_' + clash.away] = r;
  });
 
  var sim = {};
  var simPts = {};
 
  TOP6.forEach(function(t) {
    var cum = 0;
    sim[t.abbr] = FX[t.abbr].map(function(fx) {
      var h2hKey = '';
      TOP4_H2H.forEach(function(clash) {
        if (clash.home===t.abbr && clash.away===fx.oppAbbr) h2hKey = clash.home+'_'+clash.away;
        if (clash.away===t.abbr && clash.home===fx.oppAbbr) h2hKey = clash.home+'_'+clash.away;
      });
      var res;
      if (h2hKey) {
        var hr = h2hResults[h2hKey];
        res = t.abbr===h2hKey.split('_')[0] ? hr : (hr==='W'?'L':hr==='L'?'W':'D');
      } else {
        var p = probs(t.abbr, fx);
        res = roll(p.winP, p.drawP);
      }
      cum += res==='W'?3:res==='D'?1:0;
      var pp = probs(t.abbr, fx);
      return { res:res, cum:cum, winP:Math.round(pp.winP), drawP:Math.round(pp.drawP) };
    });
    simPts[t.abbr] = t.pts + cum;
  });
 
  setState({ sim:sim, ran:true, simPts:simPts });
}

    +'<div style="background:#0c1018;border:1px solid #181e28;padding:14px 16px;">'
    +'<div style="font-size:0.58rem;color:#c9a84c;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:10px">Tactical Block Matchup Matrix</div>'
    +matrixHeader+matrixRows+'</div>'
    +'</div>';
}
 
function buildTeamSelect(id, val) {
  var opts = TEAMS.map(function(t) {
    return '<option value="'+t.abbr+'"'+(t.abbr===val?' selected':'')+'>'+esc(t.name)+'</option>';
  }).join('');
  return '<select class="S" id="'+id+'" onchange="onSelectChange()">'+opts+'</select>';
}
 
function onSelectChange() {
  var h = document.getElementById('sel-home').value;
  var a = document.getElementById('sel-away').value;
  state.home = h; state.away = a;
  state.match = null; state.evs = []; state.score = {h:0,a:0};
  state.playing = false; state.fin = false;
  render();
}
 
function doKickOff() {
  if (state.home === state.away || state.playing) return;
  var m = h2h(state.home, state.away);
  state.match = m; state.evs = []; state.score = {h:0,a:0};
  state.playing = true; state.fin = false;
  render();
  var i = 0;
  playInterval = setInterval(function() {
    if (i >= m.evs.length) {
      clearInterval(playInterval);
      setTimeout(function() {
        state.fin = true; state.playing = false;
        state.hist = [{home:m.hTeam.name,away:m.aTeam.name,hG:m.hG,aG:m.aG}].concat(state.hist.slice(0,4));
        render();
      }, 600);
      return;
    }
    var ev = m.evs[i];
    state.evs = state.evs.concat([ev]);
    if (ev.type==='goal') state.score = {h:ev.hS, a:ev.aS};
    i++;
    updateFeed();
  }, 850);
}
 
function updateFeed() {
  var feed = document.getElementById('feed');
  var scoreEl = document.getElementById('live-score');
  if (scoreEl) scoreEl.textContent = state.score.h + ' – ' + state.score.a;
  if (feed) {
    feed.innerHTML = state.evs.map(function(ev) {
      var icon = ev.type==='goal' ? '⚽' : '🟨';
      var text = ev.type==='goal' ? ev.scorer + ' ('+ev.min+"')" : ev.team + " ("+ev.min+"')";
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:'+(ev.type==='goal'?'rgba(201,168,76,0.06)':'#0c1018')+';border:1px solid '+(ev.type==='goal'?'#c9a84c22':'#12161c')+';margin-bottom:2px;animation:fu 0.3s ease">'
        +'<span style="font-size:0.85rem">'+icon+'</span>'
        +'<span style="font-size:0.75rem">'+esc(text)+'</span>'
        +'</div>';
    }).join('');
    feed.scrollTop = feed.scrollHeight;
  }
}
 
function renderSimulator() {
  var hTeam = TEAMS.find(function(t){ return t.abbr===state.home; });
  var aTeam = TEAMS.find(function(t){ return t.abbr===state.away; });
  var m = state.match;
  var hMom = getMomentum(hTeam.form);
  var aMom = getMomentum(aTeam.form);
 
  var preProbs = '';
  if (!m && hTeam.abbr !== aTeam.abbr) {
    var pp = probs(state.home, { oppAbbr:state.away, h:true, md:99 });
    preProbs = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px">'
      +[['Win',Math.round(pp.winP),'#00e676'],['Draw',Math.round(pp.drawP),'#ffd740'],['Loss',Math.round(pp.lossP),'#ff1744']].map(function(x){
        return '<div style="background:#0c1018;border:1px solid #181e28;padding:10px;text-align:center">'
          +'<div style="font-size:0.54rem;color:#555;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">'+x[0]+'</div>'
          +'<div style="font-size:1.4rem;font-weight:700;color:'+x[2]+'">'+x[1]+'%</div>'
          +'</div>';
      }).join('')+'</div>';
  }
 
  var matchArea = '';
  if (m) {
    var statusLabel = state.fin
      ? 'Full Time'
      : '<span class="pulse" style="color:#ff1744;font-size:0.7rem">● LIVE</span>';
    matchArea = '<div style="background:#0c1018;border:1px solid #181e28;padding:18px 20px;margin-bottom:8px;text-align:center">'
      +'<div style="font-size:0.6rem;color:#555;margin-bottom:4px">'+statusLabel+'</div>'
      +'<div style="font-size:3rem;font-weight:900;color:#c9a84c;text-align:center" id="live-score">'+state.score.h+' – '+state.score.a+'</div>'
      +'<div style="font-size:0.72rem;color:#555;margin-top:4px">'+esc(m.hTeam.name)+' vs '+esc(m.aTeam.name)+'</div>'
      +'<div style="font-size:0.6rem;color:#444;margin-top:6px">'+m.tacticLabel+'</div>'
      +'</div>'
      +'<div id="feed" style="max-height:220px;overflow-y:auto;margin-bottom:8px;scroll-behavior:smooth"></div>';
  }
 
  var histRows = state.hist.length ? state.hist.map(function(h) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-bottom:1px solid #0d1117;font-size:0.7rem">'
      +'<span style="color:#888">'+esc(h.home)+'</span>'
      +'<span style="color:#c9a84c;font-weight:700">'+h.hG+' – '+h.aG+'</span>'
      +'<span style="color:#888">'+esc(h.away)+'</span>'
      +'</div>';
  }).join('') : '';
 
  return '<div>'
    +'<div style="font-size:1.25rem;font-weight:700;margin-bottom:16px">H2H Simulator</div>'
    +'<div style="display:grid;grid-template-columns:1fr 40px 1fr;gap:8px;align-items:end;margin-bottom:12px">'
    +'<div>'+buildTeamSelect('sel-home', state.home)+'</div>'
    +'<div style="text-align:center;font-size:0.7rem;color:#555;padding-bottom:10px">vs</div>'
    +'<div>'+buildTeamSelect('sel-away', state.away)+'</div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'
    +[{t:hTeam,m:hMom},{t:aTeam,m:aMom}].map(function(x){
      return '<div style="background:#0c1018;border:1px solid #181e28;padding:10px">'
        +'<div style="font-size:0.6rem;color:#555;margin-bottom:4px">'+esc(x.t.name)+'</div>'
        +'<div style="display:flex;gap:3px;margin-bottom:4px">'+formDots(x.t.form)+'</div>'
        +'<div style="font-size:0.65rem;color:'+x.m.color+'">'+x.m.emoji+' '+x.m.label+'</div>'
        +'</div>';
    }).join('')
    +'</div>'
    +preProbs
    +'<div style="text-align:center;margin-bottom:14px">'
    +'<button class="B" id="kickoff-btn" onclick="doKickOff()" '+(state.home===state.away||state.playing?'disabled':'')+'>'+( state.playing ? '⏳ Live…' : state.fin ? '🔄 Replay' : '⚽ Kick Off')+'</button>'
    +'</div>'
    +matchArea
    +(state.hist.length ? '<div style="background:#0c1018;border:1px solid #181e28;margin-top:8px"><div style="padding:8px 10px;font-size:0.58rem;color:#555;letter-spacing:0.1em;text-transform:uppercase;border-bottom:1px solid #151b25">Match History</div>'+histRows+'</div>' : '')
    +'</div>';
}
 
function doMC() {
  setState({ mcr:true, mc:null });
  setTimeout(function() {
    setState({ mc:mcRun(1000), mcr:false });
  }, 60);
}
 
function renderMonte() {
  var mc = state.mc;
  var mcr = state.mcr;
 
  if (mcr) {
    return '<div style="text-align:center;padding:60px 20px">'
      +'<div class="pulse" style="font-size:2rem;margin-bottom:10px">⚙️</div>'
      +'<div style="font-size:0.75rem;color:#555">Running 1,000 scenarios…</div>'
      +'</div>';
  }
 
  var btn = '<div style="text-align:center;margin-bottom:20px">'
    +'<button class="B" onclick="doMC()" '+(mcr?'disabled':'')+'>'+(mc?'🔄 Re-run 1,000 Scenarios':'🎲 Run 1,000 Scenarios')+'</button>'
    +'</div>';
 
  if (!mc) return '<div>'+btn+'</div>';
 
  var titleSorted = TOP6.slice().sort(function(a,b){ return mc.titles[b.abbr]-mc.titles[a.abbr]; });
  var maxT = mc.titles[titleSorted[0].abbr];
  var titleCards = titleSorted.map(function(t, i) {
    var pct = ((mc.titles[t.abbr]/mc.n)*100).toFixed(1);
    var bar = maxT>0 ? (mc.titles[t.abbr]/maxT)*100 : 0;
    return '<div style="background:#0c1018;border:1px solid #181e28;padding:14px 12px;border-top:3px solid '+t.color+';position:relative;overflow:hidden">'
      +(i===0?'<div style="position:absolute;top:7px;right:8px;font-size:0.8rem">🏆</div>':'')
      +'<div style="font-size:0.54rem;letter-spacing:0.1em;text-transform:uppercase;color:#555;margin-bottom:4px">#'+(i+1)+'</div>'
      +'<div style="font-size:0.72rem;font-weight:600;margin-bottom:2px">'+t.name+'</div>'
      +'<div style="font-size:1.6rem;font-weight:900;color:'+t.color+'">'+pct+'%</div>'
      +'<div style="height:3px;background:#1a1e24;border-radius:2px;margin-top:6px"><div style="width:'+Math.round(bar)+'%;height:100%;background:'+t.color+';border-radius:2px"></div></div>'
      +'<div style="font-size:0.56rem;color:#444;margin-top:4px">Avg: '+mc.avg[t.abbr]+' pts · Range: '+mc.mn[t.abbr]+'–'+mc.mx[t.abbr]+'</div>'
      +'</div>';
  }).join('');
 
  var clSorted = TOP6.slice().sort(function(a,b){ return mc.clSpots[b.abbr]-mc.clSpots[a.abbr]; });
  var clCards = clSorted.map(function(t) {
    var pct = ((mc.clSpots[t.abbr]/mc.n)*100).toFixed(1);
    var safe = parseFloat(pct)>=90, danger=parseFloat(pct)<40;
    var col = safe?'#00e676':danger?'#ff6d00':t.color;
    return '<div style="background:#0c1018;border:1px solid #181e28;padding:10px 12px;border-top:2px solid '+col+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
      +'<div style="font-size:0.7rem;font-weight:600">'+t.name+'</div>'
      +'<div style="font-size:1rem;font-weight:700;color:'+col+'">'+pct+'%</div>'
      +'</div>'
      +'<div style="height:3px;background:#1a1e24;border-radius:2px"><div style="width:'+pct+'%;height:100%;background:'+col+';border-radius:2px"></div></div>'
      +'<div style="font-size:0.56rem;color:#444;margin-top:3px">'+mc.clSpots[t.abbr]+'/1000 scenarios</div>'
      +'</div>';
  }).join('');
 
  var ptsMax = Math.max.apply(null, TOP6.map(function(t){ return mc.mx[t.abbr]; }));
  var ptsBars = TOP6.slice().sort(function(a,b){ return mc.avg[b.abbr]-mc.avg[a.abbr]; }).map(function(t) {
    var avgPct = (parseFloat(mc.avg[t.abbr])/ptsMax)*100;
    var mnPct  = (mc.mn[t.abbr]/ptsMax)*100;
    var mxPct  = (mc.mx[t.abbr]/ptsMax)*100;
    return '<div style="margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:3px">'
      +'<div style="font-size:0.7rem;font-weight:600;color:'+t.color+'">'+t.name+'</div>'
      +'<div style="font-size:0.65rem;color:#888">'+mc.mn[t.abbr]+' – <span style="color:#c9a84c">'+mc.avg[t.abbr]+'</span> – '+mc.mx[t.abbr]+'</div>'
      +'</div>'
      +'<div style="position:relative;height:6px;background:#1a1e24;border-radius:3px">'
      +'<div style="position:absolute;left:'+Math.round(mnPct)+'%;width:'+Math.round(mxPct-mnPct)+'%;height:100%;background:'+t.color+'33;border-radius:3px"></div>'
      +'<div style="position:absolute;left:0;width:'+Math.round(avgPct)+'%;height:100%;background:'+t.color+';border-radius:3px"></div>'
      +'</div></div>';
  }).join('');
 
  return '<div>'
    +btn
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#c9a84c;margin-bottom:8px">🏆 Scudetto Race</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'+titleCards+'</div>'
    +'<div style="font-size:0.58rem;letter-spacing:0.12em;text-transform:uppercase;color:#003399;margin-bottom:8px;margin-top:14px">🏟️ Champions League Spots (Top 4)</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px">'+clCards+'</div>'
    +'<div style="background:#0c1018;border:1px solid #181e28;padding:14px 16px;">'
    +'<div style="font-size:0.56rem;letter-spacing:0.12em;text-transform:uppercase;color:#555;margin-bottom:12px">Projected final points range</div>'
    +ptsBars
    +'</div>'
    +'<div style="font-size:0.6rem;color:#333;margin-top:8px;text-align:center">'+mc.ties+' tiebreak scenarios out of '+mc.n+'</div>'
    +'</div>';
}
 
function render() {
  var TABS = [
    ['runin',     '📅 Run-In'],
    ['stats',     '📊 Stats'],
    ['tactics',   '🧠 Tactics'],
    ['simulator', '⚽ Simulator'],
    ['monte',     '🎲 1000 Scenarios'],
  ];
 
  var tabBtns = TABS.map(function(item) {
    var active = state.tab === item[0];
    return '<button class="T'+(active?' on':'')+'" onclick="setTab(\''+item[0]+'\')">'+item[1]+'</button>';
  }).join('');
 
  var content = '';
  if      (state.tab==='runin')     content = renderRunIn();
  else if (state.tab==='stats')     content = renderStats();
  else if (state.tab==='tactics')   content = renderTactics();
  else if (state.tab==='simulator') content = renderSimulator();
  else if (state.tab==='monte')     content = renderMonte();
 
  document.getElementById('root').innerHTML =
    '<div style="min-height:100vh;background:#07090d;color:#e0d8cc">'
    +'<div style="background:#0e1520;border-bottom:1px solid #151b25;padding:18px 24px 0">'
    +'<div style="max-width:980px;margin:0 auto">'
    +'<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px">'
    +'<h1 style="font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#c9a84c,#e8d08a);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CALCIO SIM</h1>'
    +'<span style="font-size:0.58rem;color:#444;letter-spacing:0.18em;text-transform:uppercase">Serie A 2025/26 · Title Race · MD31</span>'
    +'</div>'
    +'<div style="display:flex;border-bottom:1px solid #151b25;overflow-x:auto">'+tabBtns+'</div>'
    +'</div></div>'
    +'<div style="max-width:980px;margin:0 auto;padding:20px 16px">'+content+'</div>'
    +'</div>';
 
  if (state.match && !state.fin) {
    updateFeed();
  }
}
 
function setTab(t) {
  state.tab = t;
  render();
}
 
render();
 
  </script>
</body>
</html>
